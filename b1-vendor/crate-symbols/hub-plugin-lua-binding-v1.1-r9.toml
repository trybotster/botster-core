# Hub→plugin contract v1.1: Lua binding appendix (for the Hub→plugin contract, revision 9)
# Revision 9 (supersedes r8 `902e5d22…05b1`, Sol Hub B REJECT): `hub/route.ended` is a client-only event on the owning route stream and a plugin cannot subscribe to it (LB-21); observation grants follow A2-23: `hub/session.activity|modes|size|silent` need `events_hub` AND `session_observe[:own|:any]`, `terminal/*` need `events_terminal[:own|:any]` (LB-12); `web.set_origin{}` with the key absent (a Lua `nil`) fails `invalid_request`, and `botster.json.null` clears (LB-15); an unmet optional binding has `provider = botster.json.null` (LB-18). Absent and null are distinct everywhere. Revision 8 additions for candidate7: descriptors per handler kind and the handler_id dispatch of `timers.arm` and `store.watch` (A2-53; `fs.watch.handler_id` stays mandatory), `Ready.timers` and `Ready.watches` entries with `handler_id?`, and the A2-8 `botster.json.null` / `nil` absence rule. Revision 8 (supersedes r7 `e5d04cd1…d1d7`; follows HP Amendment 2 candidate7, `c961d54f…47fa`, Hub B candidate-accepted; r8 was never pinned before this text): the one-timer/one-store_watch handler cap is withdrawn (LB-10); session-family frames carry no `generation` (LB-6); `hub/route.ended` has subject `{route_id}` and payload `{reason}` (LB-12); two config events `hub/config.changed` and `hub/package.configuration_changed` (new LB-21); operation kind and state tables are non-exhaustive and `reason` appears on safe_write and spawn records and on the `hub_restarted` answer of every kind (LB-13). Revision 7 (supersedes r6 `fab7d3b4…51e9`; follows HP Amendment 2 candidate2, `00eb967a…a29c0`): the 13 handler kind strings and their payloads (LB-10, A2-5); `botster.json.null` (LB-9, LB-15, LB-16, A2-8); one `wrong_state` shape with closed reasons (LB-12, A2-2); `sessions.write` result and error mapping (LB-16, A2-3); `store.batch` create and delete rules (LB-20, A2-9); http method set and header pairs (LB-11, A2-17); `sessions.update` metadata replace (LB-16b, A2-21); one timer and one store_watch handler (LB-10, A2-26); Hello and Ready fields (LB-18, A2-25); session-family frames (LB-6, A2-28); host-local names (LB-9, A2-34); the Lua `require` rule (new LB-17b, A2-47); `$schema` in the manifest (LB-17, A2-43); packaged agent definition files (new LB-19, A2-40). Revision 6 (supersedes r5 `4e778f5b…113b`): spawn arguments match Appendix A and LN-2 exactly (`worktree_id?`, `prompt?`, `context?`); LB-16b names its test; F-6 says only `response_too_large`; typed codes from the latest HP (restart failures, dependency conflicts, WP-5 exceptions) mirrored in LB-12, LB-18 and LB-15. Revision 5 (supersedes r4 `9b63a7ce…55ae`): LB-5 adds the `plugin` caller `{kind, plugin_key, instance}` (HP VC-1, PC-2) and makes the operator `credential_id` optional, with two tests (Sol Hub B, J4c review). Revision 4 (supersedes r3 `e7cd154a…074b`): cites the Hub→plugin contract by name and clause id, not by a text revision; `sessions.update` takes `{session, label?, task?, metadata?}` (the client `title` is the terminal title; no plugin writes it); the `event_gap` record is `count` with `lost_bytes?` (no `lost_events`); spawn `environment?` is `{name = string}` limited to the session type's `allowed_environment_overrides` (and `max_env_bytes`). Revision 3 (supersedes r2 `c24e677c…4655`): every behavioral clause LB-2, LB-5, LB-10 to LB-18 names its own `conf::` test (final gate 4); LB-15 follows the changed WP-1 (`set_origin{origin=nil}` clears; served origin is WP-5); checked against J3 and J4 (section G). Revision 2 (supersedes `15d61f0c…4682`): LB-17 now lists the complete MN-1 key list, including `description`, `license`, `source`, `requirements`, `provides` and `requires`.
