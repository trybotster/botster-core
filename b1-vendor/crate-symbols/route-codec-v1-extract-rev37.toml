# | `0x0F` | `output_dropped` | Sent **only when the route negotiated the feature `output_dropped`**, so a client without it never receives an unknown frame. **The worker offers the feature only on a route whose `max_frame_bytes` can carry the worst-case minimum `output_dropped` frame:** the type byte plus `{"notifications":N,"last":{"source":"osc777","truncated":true}}`, where N has as many decimal digits as the route's `route_queue_bytes` (no count can be larger, because each notification takes at least one discarded byte). On a smaller route it leaves `output_dropped` out of `attached.features`, and the guarantee does not apply. **An empty `title` or `body` is omitted, never sent as `""`.** So every report, shortened and marked, fits on a route that offers the feature. JSON `{ notifications: count, last: { source: "bell" | "osc9" | "osc777", title?, body?, truncated? } }`, sent only when `count` is at least 1, and always **before** that `resync`.<br>- **Policy actor:** the worker applies the session's notification policy (the Hub supplies it with the session; client SF-5c: `all`, `none`, or `matching` with literal substrings tested against the notification text, where a bell never matches). `count` is the number of discarded notifications that **pass** the policy, and `last` (**required**) is the last one that passes, so the client never needs to re-apply the policy to this frame.<br>- **Fits the route's frame bound:** the whole frame is at most the route's `max_frame_bytes`. When `last` would exceed it, the worker shortens `body` first and then `title`, at a UTF-8 character boundary, and sets `truncated: true`. `count` and `source` are never cut, so the frame always fits.<br>- It is an **exception frame** (TS-7): retained, ordered, never discarded. The attached client acts on it as it would have acted on the raw sequences: one notification, or a summary when `count` is above 1.<br>- OSC 52 is never reported.<br>*(Non-normative: one way to find them is to scan the discarded bytes with Core's parser.)* |
