# Botster route codec v1 — immutable extract of the Hub→client contract (revision 37) > Byte path and route clauses > A.5 Input shapes (`0x81`), with `op` as a decimal string
# **Input not reported by the modes:** Core `NotWritten(NotReported)` (for example a mouse event with tracking off, or a key release in legacy mode) sends **no frame**, as on a real terminal. `NotWritten(Unsupported { what })` becomes `input_refused { op?, reason: unsupported { what } }`.
[rows."316"]
"NotWritten(NotReported)" = ["core::WriteOutcome::NotWritten", "core::NotWrittenReason::NotReported"]
"NotWritten(Unsupported { what })" = ["core::WriteOutcome::NotWritten", "core::NotWrittenReason::Unsupported", "core::NotWrittenReason::Unsupported::what"]
"input_refused { op?, reason: unsupported { what } }" = ["codec::ToClient::InputRefused", "codec::InputRefused::op", "codec::InputRefused::reason", "codec::RefusalReason::Unsupported", "codec::RefusalReason::Unsupported::what"]

