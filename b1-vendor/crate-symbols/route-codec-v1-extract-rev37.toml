# **Typed variants are encoded by Core. `encoded` bytes are produced by the selected client.** In both cases, raw `output` is untouched, and no automatic reply ever travels as `text` or `bytes`. **A reply is fire-and-forget too:** only a refusal is sent, as `input_refused { op?, reason }` with `reason` ∈ `already_replied`, `query_expired`, `unknown_query`, `wrong_route`, `too_large` (non-exhaustive).
[rows."310"]
"already_replied" = ["codec::RefusalReason::AlreadyReplied"]
"bytes" = ["codec::ToWorker::Bytes"]
"encoded" = ["codec::QueryReply::Encoded"]
"input_refused { op?, reason }" = ["codec::ToClient::InputRefused", "codec::InputRefused::op", "codec::InputRefused::reason"]
"output" = ["codec::ToClient::Output"]
"query_expired" = ["codec::RefusalReason::QueryExpired"]
"reason" = ["codec::InputRefused::reason"]
"text" = ["codec::ToWorker::Text"]
"too_large" = ["codec::RefusalReason::TooLarge"]
"unknown_query" = ["codec::RefusalReason::UnknownQuery"]
"wrong_route" = ["codec::RefusalReason::WrongRoute"]

