# Hub→client contract, Amendment 8 (candidate 3): the Hub terminates WebRTC; routes are channels on the client's one Hub peer connection
# | A8-3 | **Every channel is chunked at `welcome.limits.max_chunk_bytes`, and the Hub interleaves route channels at chunk granularity.**<br>- **Why:** all channels of a peer connection share **one SCTP association**. Without user message interleaving (RFC 8260), the association sends each message whole, so one large message holds every other channel behind it. A route's `screen` frame can be `max_screen_frame_bytes`, much larger than a keystroke's echo on another route.<br>- **The chunk unit.** Each DataChannel message is `[u8 flags][chunk]` (TR-3). `welcome.limits.max_chunk_bytes` bounds the **chunk payload**: the bytes after the `flags` byte. The `flags` byte is not part of the chunk. This bound applies to every message on every channel, in both directions. So one message is at most `max_chunk_bytes + 1` bytes. The Hub chooses `max_chunk_bytes` so that `max_chunk_bytes + 1` is at or below the SCTP maximum message size. Route channels use the same bound as the control channel, and `route_limits` has no `max_chunk_bytes`.<br>- **Terms.** A chunk of a route channel is **ready** when the Hub has read it from the route's local stream and has not yet handed it to the association. A chunk is **submitted** when the Hub hands it to the association.<br>- **The submission rule.** When two or more route channels have a ready chunk, the Hub submits their chunks in round-robin order across those channels, one chunk per channel per turn. The channel that the Hub served last goes to the end of the turn order. So when route channels A and B both have a ready chunk, and the Hub served A last, the Hub submits B's ready chunk before A's next unsubmitted chunk.<br>- **No reordering after submission.** The Hub does not reorder payload that is already in the association. A ready chunk waits behind all payload that the association already holds. This rule states a submission order only. It does not state an order of receipt at the client between routes.<br>- **The bridge converts framing only.** Toward the client, it cuts each TS-3 frame read from the local stream into TR-3 chunks. Toward the worker, it joins TR-3 chunks into one frame and writes it with TS-3's length prefix. It **never changes a frame's bytes** (BP-2). It never merges two frames and never splits one frame except into chunks. | `conf::a8_3_chunk_payload_is_at_most_max_chunk_bytes` (the Hub sends a route frame and a control frame of `2 × max_chunk_bytes + 1` payload bytes each; for every message, the test counts the `flags` byte separately and asserts that the chunk payload is at most `max_chunk_bytes` bytes, so the message is at most `max_chunk_bytes + 1` bytes; the client joins the chunks into the exact frame; the test does not assert the number of chunks or their sizes; the Hub accepts from the client a chunk payload of exactly `max_chunk_bytes` bytes), `conf::a8_3_ready_chunk_of_another_route_is_submitted_first` (two routes A and B on one peer connection, with a testkit hook at the Hub's submission point: 1. route A's worker writes a frame of many chunks, the Hub submits A's first chunk, and the testkit holds the association's drain, so A still has unsubmitted chunks; 2. route B's worker writes a frame of one chunk, and the test waits until B's chunk is ready; 3. the test asserts that the Hub submits B's chunk before A's next unsubmitted chunk; 4. the testkit releases the drain, and every chunk of A and B arrives. Payload submitted before step 2 may arrive before B's chunk), `conf::a8_3_bridge_frames_are_byte_identical` |
[rows."26"]
"2 × max_chunk_bytes + 1" = ["hub::Limits::max_chunk_bytes"]
