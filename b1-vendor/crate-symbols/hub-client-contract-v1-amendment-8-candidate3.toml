# Hub→client contract, Amendment 8 (candidate 3): the Hub terminates WebRTC; routes are channels on the client's one Hub peer connection
# | A8-4 | **Progress, backpressure and close on a bridged route.**<br>- **Progress** of the Hub's send side is new route payload that leaves the association's send queue through transport acknowledgement (the cumulative acknowledgement advances). A retransmission, a heartbeat, a UDP write or a local enqueue is not progress (TS-7).<br>- **The bridge's send queue is bounded** by the Hub parameter **`route_send_buffer_bytes`** (default 1 MiB, range 4 KiB to 64 MiB; it moves from Core 9B unchanged, Core A17). It counts the route's payload that the Hub has read from the local stream and that is not yet acknowledged. When the queue is full, the Hub **stops reading** the route's local stream. So the worker's writes stop being accepted, and Core's own `Stream` progress rule (Core OU-3, A17-2) applies: a remote peer that stops taking payload becomes a Core stall (TS-7), as before the move.<br>- **Close by the client side:** when the channel closes or the peer connection fails, the Hub closes its end of the local stream, and Core closes the route as a `Stream` route (TS-9 `transport_lost`).<br>- **A healthy close by Core drains.** When Core closes the route with a TS-8 healthy reason, the Hub reads the local stream to its end and sends every frame that it read, through the final `route_closed` frame (TS-8). Then it closes the channel. A drain that makes no progress for `route_limits.stall_close_after_ms` is a failed route: the Hub closes the channel, and the route ends with `stalled` (TS-9).<br>- **A failed close by Core does not drain.** When Core closes the route with a TS-9 reason, the Hub closes the channel at once and discards its bridge queue. The route ends with its TS-9 reason, and frames in the bridge queue may be lost: TS-9 reads "A failed route may lack `route_closed`, and it may lose output." For example, the remote peer takes no payload, so Core closes the route with `StallTimeout` (TS-7: "If it still makes no progress after `route_limits.stall_close_after_ms`, the route ends with `stalled`."). The Hub then closes the channel without draining, and the route ends with `stalled`. | `conf::a8_4_progress_is_acknowledged_payload_not_retransmission`, `conf::a8_4_bridge_queue_is_bounded_and_backpressures_the_worker`, `conf::a8_4_stuck_remote_peer_becomes_a_stall`, `conf::a8_4_channel_close_closes_the_route`, `conf::a8_4_healthy_core_close_drains_the_bridge` (a `detached` close with frames in the bridge queue: the client receives every frame, then `route_closed { detached }` last, then the channel close), `conf::a8_4_stall_close_with_an_undrainable_queue_closes_without_draining` (the remote peer takes no payload until Core's stall close: the Hub closes the channel without sending the queued frames, and the route ends with `stalled`), `conf::a8_4_healthy_drain_without_progress_ends_stalled` |
[rows."27"]
"StallTimeout" = ["core::RouteCloseReason::StallTimeout"]
"Stream" = ["core::RouteTransport::Stream"]
"detached" = ["codec::CloseReason::Detached"]
"route_closed" = ["codec::ToClient::RouteClosed"]
