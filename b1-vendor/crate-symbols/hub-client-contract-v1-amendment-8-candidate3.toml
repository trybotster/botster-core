# Hub→client contract, Amendment 8 (candidate 3): the Hub terminates WebRTC; routes are channels on the client's one Hub peer connection
# | A8-2 | **Route connect on `webrtc`: open a channel named by the route.** `attach` (TS-1) answers `transport = { binding: "webrtc" }`. To connect, the client opens, on the **same** Hub peer connection whose control channel reserved the route, one reliable, ordered DataChannel labelled **`route:<route_id>`**, within `limits.route_connect_seconds` (TS-2).<br>- The Hub accepts the channel only when all of these hold: the label names a route that this connection's caller reserved, that is not yet connected and whose window is open, and the channel is reliable and ordered. It **closes any other channel** at once, and that reserves nothing and connects nothing. A wrong label consumes no reservation.<br>- On acceptance, the Hub creates a connected local stream pair and calls Core `attach` with its end (Core A17-2). The route then carries TS-3 route frames, delimited as A8-3 says. A failed Core `attach` ends the reservation with `route_ended { handoff_failed }` (TS-9), as on TB-L2.<br>- A route whose channel is not accepted within the window ends with `not_connected` (TS-2, TS-9).<br>- **Authentication** is the peer connection's (PR-4 to PR-9). The route channel needs no offer, no answer, no signature and no fingerprint of its own, and untrusted signalling never sees a route. | `conf::a8_2_route_channel_by_label_connects_the_route`, `conf::a8_2_channel_for_an_unknown_or_other_callers_route_is_closed`, `conf::a8_2_channel_not_opened_in_time_ends_not_connected`, `conf::a8_2_unreliable_or_unordered_route_channel_is_closed` |
