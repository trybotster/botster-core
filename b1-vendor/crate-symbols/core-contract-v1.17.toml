# | TP-1 | **An opt-in raw-output tap per session, fed in the worker, off the client data path.** `begin(SetOutputTap{session, enabled})` turns a tap on or off for a session (default off). When on, the worker copies each PTY output chunk it reads into a **bounded tap queue** (`CoreLimits.tap_queue_bytes`, default 4 MiB per session) **with a non-blocking copy at the same point that feeds the shadow terminal**, so **the tap adds no hop to any route and never back-pressures it**. **It is not free:** the copy uses worker CPU and memory bandwidth, so **the tap-on overhead is measured** (DP-10 topology T1, tap on versus off) and recorded, and the claim is bounded by that measurement. **The tap never slows the PTY reader or any client:** when the tap queue is full, the worker **drops the oldest tap data and records the loss** (the session's loss marker, kind `Tap`, with the count of bytes dropped); it never back-pressures the PTY. The host drains it with `tap_read(session, max) -> TapChunk{instance, bytes, dropped_before}` (a sync read of the host library's bounded copy; `dropped_before` counts the bytes lost before this chunk). Tap traffic on the worker's control link is the **lowest class: it delays any other host-bound control message by at most `CoreLimits.tap_inflight_bytes`** (default equal to `tap_chunk_bytes`; `tap_chunk_bytes` default 64 KiB, range 4 KiB to 1 MiB). Tap bytes equal the PTY output, in order; the tap never back-pressures the PTY or a route. (Mechanism note: today the tap is flow-controlled on the private control link.) The tap carries the **exact PTY bytes**, the same as `output` (OU-12). | `conf::tp_1_tap_is_off_by_default`, `conf::tp_1_tap_bytes_equal_pty_bytes`, `conf::tp_1_full_tap_drops_oldest_with_loss_marker_and_never_slows_the_pty`, `conf::tp_1_tap_never_back_pressures_a_route_and_overhead_is_measured`, `conf::tp_1_at_most_one_unacknowledged_tap_frame_on_the_control_link`, `conf::tp_1_control_frames_not_delayed_by_tap`, `conf::tp_1_tap_chunk_