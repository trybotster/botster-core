# Every event has one of four **queue classes**, and each class has its own bound and loss rule. **Nothing grows without a bound, and no class silently loses state.** **Retirement:** K and L events are keyed by `InstanceId`, not by the reusable `SessionId`, and **`SessionState{Released}` retires every unpolled K, L and D event of that instance, `RouteClosed` retires every unpolled route-keyed K event of that route** (a route's `Activity`), **and a service's `Released` retires that service's K and L events** (the instance no longer exists, and the host asked for its removal). **Retirement creates no loss marker,** and **an event of a retired instance is never the subject of a drop that creates or grows a class L marker**: a marker exists only for a live instance. So class L can never outnumber live instances, however often `Remove` and `Create` repeat. Class M events of a removed instance (including its `Released`) stay until polled and count against `mandatory_events`, so repeated `Remove`/`Create` cannot exceed the stated bounds: live instances bound K and L, and `mandatory_events` bounds the rest.
[rows."201"]
