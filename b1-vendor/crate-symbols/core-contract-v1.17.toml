# | ST-7 | **One atomic fact read for a probing host: `begin(ReadFacts{session, after?: InputCursor})`.** It completes with `Facts{model_rev, modes, size, cursor{row, col, visible}, input{client{rev, age_ms}, host{rev}, client_tail, tail_complete, input_records, next_cursor, gap}}`, all taken **at one point in the worker's ordering** (AM-2). `rev` are the input revisions of IN-10; `age_ms` is the time since the worker last received client input (the worker's monotonic clock); **`client_tail` is the last `CoreLimits.input_tail_bytes` (default 1,024) PTY bytes that client input wrote, exact**, and `tail_complete` says whether older bytes were dropped. **`input_records` are the session's recent PTY inputs, client and host in ONE order, as records** `{cursor, source: Client(route_tag, owner) | Host, at, kind: bytes | text | paste | key | mouse | focus, event?: press | repeat | release, key?, mods?, mouse?, focus?, payload?, payload_truncated?, state, pty_bytes}`. **A record is created at the worker's RECEIPT of the input, the same instant that `input_rev{client}` advances (IN-10), not when the PTY write completes.** Its **`state`** is `pending` (received, not yet written) until its transaction ends, then `written`, `partial`, `not_written{reason}`, `cancelled` or `unknown`; **`pty_bytes` is unknown (`null`) while `pending`.** So **a received client input is never hidden behind a later PTY write:** a host that reads a new client `rev` also sees the record that caused it. **Completion is visible to an incremental reader:** when a pending record's transaction ends, the worker **appends a status-update record** `{cursor (new), updates: <the original record's cursor>, state, pty_bytes}` with a **new `InputCursor`** (the original record is not edited in place), so a `ReadFacts(after)` that already saw the pending record sees its completion; and the completion raises the class K `Activity{source: Client(route)}` edge again (coalesced, latest value, EV-6), so a host is woken to re-read. **Retention never hides the record of the current client `rev`:** the newest record (and its status update) is always retained, with its payload truncated to a minimal form if it alone exceeds `input_events_bytes` (an oversize semantic text is truncated and flagged `payload_truncated`; the cursor, source, `at`, kind and state are always kept); only older records are dropped, oldest first, and `gap` reports it. `client_tail` holds only bytes that **were written**; **a host that derives a state such as `composing` must treat any `pending` client record as unknown**, because its bytes are not in the tail yet. Each record **keeps the input's original semantic payload** (the section 5.1A fields exactly as sent, so a named key such as `enter` is visible without decoding escapes; byte, text and paste content truncated at `CoreLimits.input_event_payload_bytes`, default 256, with `payload_truncated`), and `at` is the **worker's monotonic stamp**. **The cursor is one unified, instance-scoped, opaque `InputCursor`:** it orders client and host records in a single sequence, and **a host compares cursors only for equality and with `after`, never as sortable numbers** (the opaque `rev` values are not sortable either). **Incremental read:** with `after` set, the read returns **only the records after that cursor**, a `next_cursor`, and **`gap: true` if retention removed any record between `after` and the oldest record returned** (or if `after` belongs to another instance). Without `after` it returns the retained window and `gap` tells whether older records were dropped. The window is bounded **by records** (`CoreLimits.input_events_kept`, default 64) **and by bytes** (`CoreLimits.input_events_bytes`, default 16 KiB); older records are dropped first. **A gap is not a proof of absence:** when `tail_complete` is false or `gap` is true, or after any worker link loss, the facts **cannot prove that no draft is in progress**; Core makes no claim, and a host that derives a state such as `composing` must treat it as **unknown** until it observes a point at which it can be sure (for example a client input that resets the line). **This is a generic fact, not a readiness policy:** the host derives whatever it needs (a `composing` state, a doorbell decision) from the tail and the revisions, and **Core names no such state**. After a worker link loss or any gap, **a host reads `ReadFacts` before it writes a guarded probe and sends nothing until that read succeeds.** A coalesced final edge (input, mode or output) stays observable through the class K events and `EventsLost` (EV-6), and `ReadFacts` is the authoritative read. | `conf::st_7_facts_are_read_at_one_ordering_point`, `conf::st_7_client_tail_is_exact_and_bounded`, `conf::st_7_tail_complete_flag`, `conf::st_7_events_distinguish_paste_release_and_no_write`, `conf::st_7_event_keeps_the_original_semantic_payload`, `conf::st_7_events_bounded_by_records_and_bytes`, `conf::st_7_incomplete_history_is_flagged`, `conf::st_7_incremental_read_returns_records_after_the_cursor`, `conf::st_7_gap_is_reported_when_retention_removed_a_record`, `conf::st_7_one_cursor_orders_client_and_host_records`, `conf::st_7_record_is_created_at_receipt_with_pending_state`, `conf::st_7_completion_appends_a_status_update_with_a_new_cursor`, `conf::st_7_incremental_reader_sees_completion_of_a_pending_record`, `conf::st_7_completion_raises_the_keyed_activity_edge`, `conf::st_7_newest_record_is_never_dropped_even_when_oversize`, `conf::st_7_limits_that_cannot_hold_the_protected_records_are_invalid_config`, `conf::st_7_new_client_rev_is_never_visible_without_its_record`, `conf::st_7_tail_holds_only_written_bytes_pending_is_flagged`, `conf::st_7_cursor_from_another_instance_is_a_gap`, `conf::st_7_facts_after_link_loss` |
