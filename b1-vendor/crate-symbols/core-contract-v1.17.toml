# | EV-8 | **Terminal queries: the most recently active client answers first, the shadow terminal answers otherwise, exactly one reply reaches the program (the user's decision T2). The worker arbitrates; the host supplies only the deadline.** A program asks the terminal a question and waits. (a) **The rule.** For every query that needs a reply, the worker offers it to the session's **most recently active route** (the route that most recently sent client input, "Latest"; if none has, the most recently attached route that has `input`), waits the **host-supplied** time, and answers with the **shadow terminal** (the session's model, the pinned library) if no client answer is admitted in time, if the client declines, or if no route is eligible. The first valid answer wins; **a late answer is refused; nothing is answered twice.** Where the shadow has no answer (shadow set below), an unanswered query is answered by **nobody**. (b) **Host policy: a positive deadline supplied at attach.** Each route that may answer queries (`options.answers_queries`, default true) is attached with **`options.query_deadline`**, a duration from `1 ms` to `CoreLimits.max_query_deadline` (default 60 s; the cap only bounds a host's stall); a missing or zero `query_deadline` on such a route is `InvalidInput` at `attach`. **There is no shadow-first default for a connected client:** the worker always gives an eligible route its opportunity. A session with **no eligible route** answers every query from the shadow at once. Core has **no other query timer** and no policy of its own; **the deadline runs in the worker**, on its own monotonic clock, from the value the host supplied. (c) **On the route.** The worker writes the **`terminal_query`** frame of DP-3 to the chosen route, and the client answers with **`input{kind: reply_terminal_query, op, query_id, reply}`** on the same route; **an applied reply has no acknowledgement; a refusal is an `input_refused` with reason `already_replied`, `query_expired`, `unknown_query`, `invalid_input` or `too_large`** (effect none). A reply from any route other than the one the worker bound the `query_id` to is `input_refused{invalid_input}`. `query_id` is **opaque, minted by the worker**; `request_bytes` is the exact query (at most `CoreLimits.max_query_bytes`, default 4096; a longer one is answered by the shadow at once, recorded in the loss marker as kind `Query`); `answer_within_ms` is the remaining wait. The client's renderer **suppresses its own autonomous replies** (a client rule in the client contract), because this is the only answer. **Wire order on the route:** the route carries the raw `Output` bytes **up to and including the query sequence**, then the `terminal_query` frame, then the later `Output`, so a client answers against the terminal state **at the query point**. A query's `query_id` (and any id a client sends or receives on a route) is **scoped to its route and session** and is a **separate namespace from host `OpId`s**. `options.answers_queries: bool` (default true) excludes a route from being asked. The host is **not** on this path and sees no event. (d) **The shadow reply is computed at the query point and held.** At each query the worker computes the shadow reply **from the model state at that moment** (never from a later cursor or SGR state) and **holds it unwritten**, bounded by `max_query_reply_bytes`; **the worker writes no reply before the client's opportunity ends.** (e) **Admission: one point, one consumption.** `reply` is one of: a **typed reply** (table below; the worker encodes the bytes); **`Encoded{bytes}`** (the complete reply bytes that the client produced, at most `CoreLimits.max_query_reply_bytes`, default 64 KiB; the worker only bounds and admits them); or **`Decline`** (the client cannot answer: **the fallback starts at once; `Decline` is not an answer and consumes nothing**). **The fallback is one more admission of the same `query_id`.** The first **answer** admitted consumes it (a client `encoded` or typed reply, or the fallback); **a `Decline` consumes nothing, so the `query_id` stays pending until the fallback admission succeeds** (and a fallback that cannot yet be admitted stays pending and is retried). **A `Decline` ends that client's opportunity:** a later reply from the client is `input_refused{query_expired}` until the fallback is admitted and `input_refused{already_replied}` after it. atomically in the worker's one admission point (AM-2): **"the fallback has started" means it was admitted**, and a late client reply is then refused and ignored. **Admission reserves the full encoded bytes** (base64 expansion and framing included) **against the session's input bounds**; **a refused admission (a full lane) leaves the query pending and does not consume the `query_id`**: a fallback that cannot yet be admitted is **parked** and retried when input capacity frees, **never spun on**. (f) **Every reply is an ordinary contiguous write** through the worker's input-transaction queue **between transactions, never inside one** (AM-2; a paste is never split), keeps the order of its queries, and **never advances `input_rev`** (IN-10). (g) **Capacity is reserved, and a query is never discarded:** at most `CoreLimits.pending_queries` (default 8) queries per session are open; when that is full, **output after the next unadmitted query is held in order** (source backpressure, as OU-3d); no byte is dropped or reordered, and a slot frees on admission, or when its session ends or is removed. The wait is bounded by the **host-supplied** deadline. (h) **Retirement, and survival:** queries retire on session removal, payload end, route close (a query offered to a route that closes falls back to the shadow at once), or admission. **Open queries live in the worker, with the routes, and survive a host restart:** the client keeps waiting on its route, the deadline keeps running in the worker, and the worker resolves the query with no host involved. (i) **A resync ends the answer opportunity only for an AFFECTED query.** A client answers against the terminal state **at the query point**, which it reconstructs from the raw `output` prefix up to the query. **An affected query is one whose required output prefix a resync (or a stall discard) removed from the route, which means its `terminal_query` frame had not started.** For an affected query the route's opportunity ends at once: the worker admits the **saved shadow fallback** (the parse-point answer, (d)), **retires the route's unstarted `terminal_query` frame** (it is not sent after the new baseline), and answers a later client reply with `input_refused{query_expired}` until the fallback is admitted and `input_refused{already_replied}` after it. **A query whose frame was already sent, or started and then finished (OU-4), is NOT affected:** ordered delivery has already carried its prefix to the client, so it keeps its opportunity across the resync. **If admission of the fallback is refused** (for example, the lane is full), the affected query **stays pending on the fallback path only** and is retried as room frees; **the stale client-answer path is never reopened.** So a client can never answer from stale state on a fresh baseline, and exactly one reply reaches the program. (j) **Every query stays in `Output`** (OU-12), answered or not. (k) **A host and client rule, not a Core filter:** automatic replies use **only** `reply_terminal_query`; the worker does not inspect input `Bytes` and cannot stop a client from writing a reply as bytes; a client that does so gives up the exactly-once guarantee. | `conf::ev_8_attach_requires_a_positive_query_deadline`, `conf::ev_8_open_query_survives_host_restart`, `conf::ev_8_query_goes_to_latest_route_with_host_deadline`, `conf::ev_8_client_answers_first_shadow_suppressed`, `conf::ev_8_client_silent_shadow_answers_at_deadline`, `conf::ev_8_client_decline_makes_shadow_answer_at_once`, `conf::ev_8_decline_does_not_consume_the_query_id_before_fallback