# | DP-3 | **ONE route protocol, shared with the client contract, implemented by the worker: the immutable extract `route-codec-v1-extract-rev26.md`, **revision 26** (sha256 `bf59b2b605e21b7e59b8d191cebdac5244241414d5d8f5c1372a86ece52a7abf`), which holds the Hub→client P9 query steps, BP-1 to BP-5 and BP-7, TS-1 to TS-11, TR-3 and A.1 to A.6.** **A change to any of it needs a new extract and hash agreed by both pairs.** The summary below is for reading; **the extract governs.** **Core requires of the extract only the route clauses** (the query steps, the route part of TS, TR-3, A.1, A.4 to A.6 and the close mapping); Hub-only material in it is non-normative for Core, and values in it are read as the named parameters here. A change to the route codec is made in **both** contracts in one change. **Framing:** `[u32 big-endian length][u8 type][body]` on a stream, **the length counting the type byte plus the body**. **On a WebRTC DataChannel the framing is the client contract's TR-3, exactly:** each message is `[u8 flags][chunk]`, bit 0 of `flags` is `final` and the other bits are 0; a frame is the concatenation of its chunks up to and including the one marked `final`, **without the length prefix** (`[u8 type][body]`); each chunk is at most `max_chunk_bytes` (chosen by the host at attach, at or below the SCTP maximum message size); a frame that is incomplete when the channel closes is discarded. The per-type frame limits below apply to the reassembled frame, and a frame is refused as soon as it passes its limit, before more chunks are buffered. **Frame limits are per route (`route_limits`, OU-1):** every frame except the screen and a history page is at most `max_frame_bytes`; **the screen is ONE `screen` frame, at most `max_screen_frame_bytes` (at least `max_snapshot_bytes + 1`, the type byte included)**, and on a WebRTC route TR-3 chunking carries it past the SCTP message limit; **history is paged, each `history` frame at most `max_history_page_bytes`**. The limit is **checked before any allocation**, and a frame over it is a protocol error. **Worker → client:** `0x01 attached` (JSON `{features: [..], terminal_format, limits: {max_frame_bytes, max_screen_frame_bytes, max_history_page_bytes, max_chunk_bytes, max_paste_bytes, max_query_reply_bytes, max_file_bytes, query_client_deadline_ms, stall_deadline_ms, stall_close_after_ms}}`: the route's **own** features and the **applied `route_limits`** (the wire projection of `RouteLimits`, OU-1), announced by the worker that serves it and authoritative for that route; **there is no older, smaller limits body**); `0x02 baseline_begin` (JSON `{rows, cols, modes}`); `0x03 screen` (one frame: the `GHOSTSNP` screen payload); `0x04 history` (one history page); `0x05 baseline_end` (JSON `{history: not_requested\|complete\|{unavailable: reason}\|{incomplete: reason}}`); `0x06 live` (empty; **the input-ready point**); `0x07 output` (**the exact PTY bytes**); `0x0E output_deflate` (**raw DEFLATE, RFC 1951, of ONE output payload**; sent only when the route negotiated the feature `output_deflate`, and **the worker chooses per frame**; the inflated payload is at most **the route's output frame bound minus the type byte** (`max_frame_bytes` − 1), and a larger or corrupt stream is `protocol_error{invalid_input}` on the receiver); `0x08 modes` (JSON `{modes, rows, cols}`, `rows` and `cols` being the size actually applied); `0x09 resync` (JSON `{reason: stalled\|overflow}`); `0x0A input_refused` (JSON `{op?, reason, written_bytes?, path?}`, sent only when an input is not applied as sent); `0x0D input_done` (JSON `{op, written_bytes, path?}`, for a `paste_commit` with `want_result: true` and for every `file_commit`); `0x0B route_closed` (JSON `{reason, exit?}`); `0x0C terminal_query` (JSON `{query_id, request_bytes_base64, kind?, shadow_answerable, answer_within_ms}`; `kind` only for the typed kinds, in snake_case, as in EV-8). **Client → worker:** `0x85 file_chunk` (`[u64 op][bytes]`: file bytes that are 