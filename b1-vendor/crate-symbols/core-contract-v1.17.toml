# | DP-5 | **Input on a route is fire-and-forget: the worker reports only exceptions (the user's rule: a terminal over ssh has no per-keystroke acknowledgement).** **No input has a success acknowledgement, and a resize has no answer** (the effective size arrives in `modes`, DP-6). The route's ordered, reliable delivery is the guarantee: **the worker processes each input in its receive order on the route** (the rev-20 TS-5c states): it is **written**, **refused** (an `input_refused` for it), or, **for input that the modes do not report (`NotReported`), omitted with no frame**. **Silence therefore proves neither a completed write nor the absence of a refusal in transit.** `op` is **optional** (binary frames: 0 means none), **except on a paste, which needs a nonzero `op`**; ids are in a namespace **separate from host `OpId`s**. **No input before `live`** (it is refused `not_ready`). **Paste:** `paste_begin`, `paste_chunk`s, then `paste_commit` or `paste_abort`, all with the same `op`; the paste is **assembled in the worker** (bounded by `max_paste_bytes`; over it, `input_refused{too_large}` at the first chunk that exceeds it) and **written as one contiguous transaction at `paste_commit`** (AM-2, IN-8); an abort before the commit writes nothing and sends no frame; a paste not committed when the route ends writes nothing. **`input_done{op, written_bytes, path?}` (0x0D) answers exactly two things: a `paste_commit{want_result: true}` and every `file_commit` (DP-5b); nothing else.** **The worker sends `input_refused{op?, reason, written_bytes?}` (0x0A) only when an input is not applied as sent.** Core write outcome (IN-2) → route: `Written`, `Cancelled` (an abort) → **no frame**; `NotWritten(NotReported)` (the modes do not report the event, such as a mouse event with tracking off) → **no frame, as on a real terminal**; `NotWritten(ModePreconditionFailed)` → `input_refused{mode_precondition_failed}` (the one wire reason; the client derives its own user-facing reason from the payload it sent; Core never classifies content and the wire has no `unsafe_paste`); `NotWritten(Unsupported{what})` → `input_refused{unsupported{what}}` (**invalid UTF-8 in a `text` frame included**); `NotWritten(Refused)` → `input_refused{refused}`; `NotWritten(PayloadTooLarge)` → `input_refused{too_large}`; `NotWritten(SessionEnded)` and `NotWritten(Stopping)` → `input_refused{session_ended}` (**`session_ended` is a reason, not an outcome**); a view-only route (`options.input = false`) → `input_refused{not_writable}`; `Failed`, and `Partial` or `Unknown` after a write began → `input_refused{failed}` or `input_refused{session_ended}`, **carrying `written_bytes` when known** (exact when known, **absent when unknown**). **This applies to every input kind:** a partial write can follow `bytes`, `text`, a paste or a multi-byte encoded key. A refusal means the input had no effect, **except** `failed` and `session_ended` after part of any input was written; `NotWritten(Stale)` is **not applicable on a route** (a client frame carries no guard, IN-10); `NotWritten(LaneFull)` **is never a route reason**: input is never dropped for lack of room, because **when the worker's input queue for the route is full (`CoreLimits.route_input_queue_bytes`, default 1 MiB) the worker stops reading the route and transport backpressure applies.** The reason set on the wire is `not_ready`, `not_writable`, `too_large`, `mode_precondition_failed`, `unsupported{what}`, `refused`, `session_ended`, `failed`, plus `write_failed` (a file could not be written on the host, DP-5b) and the query-reply reasons of EV-8 (`already_replied`, `query_expired`, `unknown_query`, `invalid_input`, `too_large`); it is non-exhaustive, and a client shows an unknown reason as `other` with zero effect. **Evidence survives a route failure:** an `input_done` or `input_refused` that already arrived decides that input's outcome; only an input without one is unknown. **Silence proves neither a completed write nor the absence of a refusal in transit.** **Retention across a resync:** a resync drops only `output` and baseline frames that have not started; `input_refused`, `input_done` and `route_closed` are retained and delivered on the continuing route. **Bound on refusals: no separate count.** `input_refused` and `input_done` frames **wait in the route's existing outgoing queue under `CoreLimits.route_queue_bytes`**, and a resync never discards them; **when that queue cannot hold one more, the worker stops reading the route's input** (transport backpressure), so a client that floods refused input and never reads is bounded at `route_queue_bytes`. Nothing is queued for an applied input. **Control frames stay bounded:** `modes` coalesces to ONE latest unstarted frame per route; an unstarted `terminal_query` frame retires when its query resolves or falls back (EV-8); a frame that has started always completes, or the transport closes (OU-4). **Only an unparseable frame closes the route** (bad framing, invalid JSON, a missing required field: `BadFrame`); **a parsed frame with an unknown enum value** (a key, modifier, button, input kind, reply variant or mode value) **is `input_refused{unsupported{what}}` and the route stays open.** `paste_begin` carries `require_bracketed`; there is no `allow_unsafe` on the wire, and a user-confirmed resend is a **new** op with `require_bracketed: false`. **Unadulterated bytes:** a `bytes` or `text` frame reaches the PTY **exactly as sent**; the worker adds only the contractual paste markers (IN-8) and the semantic encodings (IN-9). | `conf::dp_5_no_input_has_a_success_acknowledgement`, `conf::dp_5_resize_has_no_answer_size_arrives_in_modes`, `conf::dp_5_op_is_optional_except_on_a_paste`, `conf::dp_5_input_before_live_is_refused_not_ready`, `conf::dp_5_paste_is_assembled_and_written_contiguously_at_commit`, `conf::dp_5_abort_before_commit_writes_nothing_and_sends_no_frame`, `conf::dp_5_input_done_only_for_want_result_true`, `conf::dp_5_every_not_written_re