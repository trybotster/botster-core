# | OU-2 | **Route state machine** (one, explicit; owned by the worker). States: `Open`, `Stalled`, `Closed`. `Open → Stalled` when the route's socket accepts no bytes for `CoreLimits.reader_progress_deadline` while frames are pending (OU-3b); the worker tells the host (`RouteStalled{route}`). `Stalled → Open` when the socket accepts bytes again; the worker sends a `Resync` first and the host sees `RouteResumed{route}`. `Open|Stalled → Closed` only for: `detach(route)` (reason `Detached`); session end, after the queue drained (OU-7; `SessionEnded`); `Remove` (`SessionRemoved`); the peer closing or failing its transport (`PeerClosed`); an **unparseable** input frame (`BadFrame`, DP-5: bad framing, invalid JSON or a missing required field; **a parsed frame with an unsupported enum value does not close the route**, it is answered `input_refused{unsupported{what}}`); a baseline or resync that cannot be formed (`SnapshotTooLarge`, OU-9); a stall longer than `CoreLimits.stall_close_after` (`StallTimeout`); or a transport handoff that failed (`HandoffFailed`). `Closed` is terminal. **The worker closes the transport once**, after a `Closed{reason}` frame when the socket can take it, and posts `RouteClosed{route, reason}` to the host **once**, with the **first** reason. A stalled route is never closed by the stall alone before `stall_close_after`. | `conf::ou_2_route_state_machine`, `conf::ou_2_close_once_first_reason_wins`, `conf::ou_2_stall_close_after`, `conf::ou_2_stall_and_close_are_reported_to_the_host` |
