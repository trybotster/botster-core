# | SV-6 | **Epochs, reconnect and adoption.** A service has an `epoch` (u64, scoped to its instance; chosen by the service in the preamble, SV-2). The first connect is epoch 1. **A full reconnect is a new epoch, and an epoch is staged as a group:** the service connects **all** lanes with **the same epoch**; Core accepts a preamble with an epoch higher than the last **committed** epoch, and an **equal** epoch is valid for the other lanes of the group being staged. **Core commits the epoch (posts `ServiceState{Reconnected{epoch}}` and permits payload frames) only after every lane has authenticated.** Until then no payload frame is read or delivered. **On a fault on any lane** (SV-2 reasons), **Core ends every lane of that epoch**, resets all parsers and queues on both sides, and the service reconnects **all** lanes with a higher epoch; frames of an old and a new epoch are never mixed. Core closes every connection of an older epoch when it stages a higher one, and rejects a lower epoch. A reconnect happens after a host restart and adoption (AD-1), or after the host ends an epoch with the generic call `begin(EndEpoch{service})` (completes once every lane of the epoch is closed; the service then reconnects). Partial frames are never resumed. **Unsent outbound frames are dropped and counted** in `LaneEnded`; **frames already received are kept** for the rest of this **host process's** life and stay readable until `RemoveService`, each tagged with its old epoch; the host treats a frame whose epoch is lower than the current one as previous-generation data. **Received frames live in the host library's memory, so a host crash loses them:** after adoption the new host's inbound queues start empty, and nothing is replayed. There is **no replay** by Core: the host re-handshakes with its own `Hello`. An exhausted epoch counter is `Lost(EpochExhausted)`. After adoption the **same guardian and service process** continue. | `conf::sv_6_epoch_commits_only_after_all_lanes`, `conf::sv_6_equal_epoch_valid_within_staged_group`, `conf::sv_6_one_lane_fault_ends_all_lanes_then_higher_epoch`, `conf::sv_6_no_mixing_of_generations`, `conf::sv_6_partial_frame_never_resumed`, `conf::sv_6_unsent_dropped_received_kept_with_old_epoch_tag`, `conf::sv_6_host_crash_loses_unpolled_frames`, `conf::sv_6_lower_epoch_rejected`, `conf::sv_6_same_process_after_adoption` |
