# | IN-10 | **Generic optimistic concurrency for a write's start, decided at the worker's one admission point.** The worker keeps, per session instance and per source class (`Client`, `Host`), an opaque **input revision**. **`Client` advances when the worker has received a complete client input frame; `Host` advances when it admits a host write.** The host learns the latest value from `Activity` and `terminal_state(id).input_rev{client, host}` (values as last reported; they may lag). `WriteInput` may carry **`guard: Guard{input?: {source_class, rev}, model_rev?: ModelRev}`**: an **input guard**, a **terminal guard**, or both. **The worker checks the guard at the START of the write transaction, atomically with the ordering of AM-2**: the **input guard** passes iff no input of `source_class` **other than this write itself** was received or admitted after `rev`; **the terminal guard passes iff the session's `model_rev` (ST-1) still equals the given token** (a redraw, any output, a cursor, screen or mode change, or a resize after the host's read moves it). **Both must pass**, and either failing refuses the write. If it fails, the write is **not written** and completes `NotWritten(Stale)` with **exact zero** bytes. **Guarantees:** a client frame the worker received **before** the guarded write starts makes it `Stale`, whatever the host had or had not yet seen; a client frame received **after** it starts is ordered after it and never lands between its fragments (AM-2). A host whose view lags can only get a `Stale` that it could have avoided, never a write that it should not have made. **It protects only the start:** a started write is written (fully, or partly if a cancel or a fault ends it), and `cancel(op)` is a best-effort request whose completion proves the progress (IN-6). **A client input's revision counts even if the frame is later refused or cancelled.** Core never retries a write or re-checks a guard. **Consumer:** the collaboration doorbell. | `conf::in_10_guard