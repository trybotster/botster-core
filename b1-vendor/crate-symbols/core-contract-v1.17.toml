# **The shadow's color answers come from the session's color profile, which the host supplies** (`SpawnRequest.color_profile`, and `begin(SetColorProfile{session, profile})` to change it: the default palette and the foreground, background and cursor colors), so a session with no client attached answers color queries with the host's real colors. **Which queries the shadow answers is implementation-defined, and reported.** Each `terminal_query` carries `shadow_answerable`, and `Core::shadow_answerable_kinds()` lists the kinds for the running implementation. **Invariants for every implementation** (they do not depend on any library version): the shadow **never echoes program-controlled text** (no window-title or icon-label report); a **pixel report is answered only when the session has `Size.cell_px`**; the **clipboard read is never answered by the shadow**; and a query that the shadow cannot answer, left unanswered by the client, is answered by nobody. **Non-normative:** for the current terminal library (`eb72ec61…`, evidence in `ghostty-query-inventory-20260930.md`) the shadow answers device attributes, `DSR` 5 n and 6 n, `DECRQM`, `XTVERSION`, the kitty flags query, the colors, `DECRQSS`, `XTGETTCAP`, `CSI 18 t` and, with `cell_px`, `CSI 14 t`, `CSI 16 t` and the mode-2048 reports; it cannot answer `CSI 21 t`, `11 t`, `13 t`, `15 t`, `19 t`, `20 t`, or the clipboard read. A library update changes this list and no contract clause.
