# botster CLI v1: the `botster` binary as a client of the Hub (draft, working file; candidate 9) > 5. start, attach, status (CLI-ST, CLI-AT, CLI-SS)
# | CLI-ST6 | **Binary swap, one rule for both directions (UD-1, orchestrator).** The one Hub runs one binary; `get(hub)` reports it as `software`. **Any build** (dev or release) whose `start` or `attach` finds the Hub running a different binary **refuses**: it prints `Hub runs <running binary>; this is <this binary>. Use --swap to replace it.` and exits 1 (`start --headless` refuses the same way). Nothing else replaces a Hub: no build swaps without `--swap`. With `--swap` the **Hub owns the commit** (DEP-11; a read followed by `shutdown` would race a worker launched in between). The CLI: (1) may first call the read `swap_preflight` (DEP-10) to show the operator the result early; (2) calls `invoke(hub, <hub_id>, swap, { target_worker_protocol, drop_unadoptable? })`, in which the Hub **stops launch admission (spawn and restart are refused `wrong_state { swap_in_progress }` meanwhile), checks the final live set and only then commits**, answering either `accepted` or the typed refusal `wrong_state { unadoptable_sessions, sessions }` (it also lists `unknown`), with nothing stopped and admission reopened. A live worker whose protocol is **unknown** counts as unadoptable: it is refused unless `--drop-unadoptable`. **Output (stderr, exit 1 for a refusal):** a refusal prints `Swap refused: sessions that cannot be adopted`, then `  unadoptable: <session ref> ...` and `  unknown protocol: <session ref> ...` (a line is omitted when its list is empty), then `Use --swap --drop-unadoptable to end them.` The preflight prints two separate lists, `unadoptable` (session, worker protocol) and `unknown protocol` (session). The **refusal** carries only session references (`sessions`, `unknown`, HC40); the CLI prints them as two separate lists and **prints no worker protocol from a refusal** (only the preflight returns one; the CLI never invents or infers a protocol value). `--drop-unadoptable` names the ended sessions of both groups by session reference. `drop_unadoptable` is sent only for `--swap --drop-unadoptable`, and the output names each ended session. A swap never ends a session silently. (3) After `accepted` the CLI waits for the **handover event** of DEP-11 (the control connection's `close` states that the Hub released its singleton lock and socket; a bare socket close proves neither, HS-9), then starts its own Hub as CLI-ST2 does. A close without the handover proof is reported as a failed swap and **no new Hub is started**. `target_worker_protocol` is the worker protocol built into the CLI's install. Adoptable sessions survive through Core worker adoption; the terminal UIs reconnect (CLI-AT4). `dev-rebuild` passes `--swap` explicitly (CLI-DV3). | `conf::cli_st6_refuses_without_swap`, `conf::cli_st6_hub_commits_after_admission_stop`, `conf::cli_st6_unadoptable_refused_and_listed`, `conf::cli_st6_drop_unadoptable_explicit`, `conf::cli_st6_waits_handover_proof`, `conf::cli_st6_second_hub_refused` |
