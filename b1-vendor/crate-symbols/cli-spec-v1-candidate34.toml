# botster CLI v1: the `botster` binary as a client of the Hub (draft, working file; candidate 9) > 8. update and pairing URL (CLI-UP, CLI-PU)
# | CLI-UP2 | **`update`** prints the current and the latest version. If there is nothing newer it prints `✓ Already running the latest version (or newer)` and exits 0 (CL-116). Otherwise it calls `invoke(hub, <hub_id>, update)`, a durable operation (EN-7), watches the operation, prints its progress, and on success prints `✓ Successfully updated to version <X>`; on failure it prints the Hub's error and exits 1. The `update` action's refusals (HC A.9b) are printed as: `wrong_state { up_to_date }` → `✓ Already running the latest version` (exit 0); `offline` and `dev_build` → the texts of CLI-UP1 (exit 1); `update_in_progress` → `An update is already in progress` (exit 1); `swap_in_progress` → `A binary swap is in progress; try again afterwards` (exit 1). **The CLI downloads, verifies and replaces nothing** (the legacy CLI did all three, CL-113..115; deviation D-5). The Hub restarts itself; the CLI does not exec itself. **Across the restart:** the control connection ends with `close { hub_shutdown }`. The CLI then reconnects: it **repeats TB-L1 discovery and the handshake until `welcome`**, each attempt bounded by the CLI-RT4 probe (500 ms), with **no contract deadline**; the user may interrupt (SIGINT prints `operation <id> continues in the Hub` and exits 130, as CLI-PL2). It then calls `get(operation, <id>)` (the operation is durable, EN-7b), retrying `busy`. **If the row is not terminal** (`terminal: false`, for example the update is still `installing`), the CLI **resumes the watch** of that operation (EN-7b) and prints its progress until `terminal: true`; an outcome the Hub reports as `unknown` is printed as unknown, never turned into success or failure. `succeeded` prints the success line; `failed` prints the reason and exits 1. The values that `check_update` and the operation `result` carry are **DEP-15** (HC Amendment 2); the line texts above do not change. | `conf::cli_up2_update_operation` |
