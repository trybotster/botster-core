# | CLI-G2 | **Exit codes.** Success 0. A usage error 2. Any other failure prints `Error: <message>` to stderr and exits 1. **Exit 130** means *interrupted; the Hub operation continues*: a waiting command (CLI-PL2, CLI-UP2) ended by SIGINT. Exceptions kept from the legacy CLI: `status` always exits 0 (CLI-SS1); `get-connection-url` with no URL exits 1 (CLI-PU2). (CL-5) | `conf::cli_g2_exit_codes` |
