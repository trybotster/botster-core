# | CLI-PL4 | **`update [<name>...\|--all] [--preview|--check] [--bind <interface>=<provider>]... [--accept-breaking <consumer>:<interface>]...`.** With neither a name nor `--all` the command is a usage error (exit 2). `--preview` (alias `--check`) is `invoke(package, preview_upgrade)`, a read: it changes nothing and prints per plugin the old and new commit and hash, the changed files, the manifest diff and the grant diff, or `<name> up to date`. Without `--check` it runs `upgrade` for each name; `--all` is `invoke(hub, upgrade_packages)`, and `--all --preview` is `invoke(hub, preview_package_upgrades)`. A pinned plugin is skipped with `<name> pinned at <ref>` (an update never moves a pin). An upgrade that adds grants ends `staged` (as CLI-PL3). **Single package (HP PD-6, PD-8):** `--bind` is sent as `bindings` and each `--accept-breaking <consumer>:<interface>` (repeatable) as `accept_breaking: [{ consumer, interface }]` in `upgrade`. A breaking provider change is refused unless every affected consumer is named: the CLI prints the affected consumers and the hint `Accept with --accept-breaking <consumer>:<interface>`, exit 1, and never adds one on its own. Accepted consumers end `degraded` (CLI-PL5). **Bulk (`--all`, DEP-14):** `upgrade_packages` takes `bindings: [{ consumer, interface, provider }]` and `accept_breaking: [{ consumer, interface }]`, and **resolves as one unit**: the Hub refuses an unresolved request **before any operation starts**, with `conflict { reason: requirement_conflict | ambiguous_provider | requirement_missing, … }` and `effect: none` (HC parity42). With `--all` the `--bind` form is `<consumer>:<interface>=<provider>` (the consumer is required; without `--all` it is `<interface>=<provider>`). `--all --preview` calls `preview_package_upgrades` and prints its `ambiguous: [{ consumer, interface, candidates }]` with the hint `Choose with --bind <consumer>:<interface>=<provider>`. If the Hub answers that request-time `conflict` (ambiguity, missing or conflicting requirement, unaccepted breaking change) with `effect: none`, the command prints the reason, states that **no package was changed**, and exits 1. **That sentence is printed only for an answer that carries `effect: none`.** After resolution succeeds the upgrades run; the command prints the **outcome the Hub reports for each package** and exits 1 if any failed. A package that activated and then crashed is reported as such: the CLI never says nothing was upgraded, and never offers a rollback it did not run (HP PM-7 gives none automatically). The CLI never retries with options it was not given. | `conf::cli_pl4_update_check_and_pins`, `conf::cli_pl4_update_staged`, `conf::cli_pl4_bind_and_accept_breaking_mapping`, `conf::cli_pl4_breaking_refused_lists_consumers`, `conf::cli_pl4_all_bulk_bindings`, `conf::cli_pl4_all_preview_ambiguous`, `conf::cli_pl4_all_resolution_refusal_changes_nothing`, `conf::cli_pl4_all_execution_outcome_per_package` |
