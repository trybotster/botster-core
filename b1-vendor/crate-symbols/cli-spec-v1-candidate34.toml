# botster CLI v1: the `botster` binary as a client of the Hub (draft, working file; candidate 9) > 7. `mcp-serve` (CLI-MS)
# | CLI-MS2 | **Lifecycle and replay.** The proxy performs the MCP initialization handshake of the negotiated revision (HC MC-0) on behalf of an agent that sends a request first, keeps the `Mcp-Session-Id` the server returns and sends it on later calls, and sends `MCP-Protocol-Version` (CL-52). **It never replays a request that may have had an effect** (HC EN-3 and EN-8: after a lost reply the effect of a mutation is unknown, and a JSON-RPC id is not an idempotency guarantee). The rules: (a) a connection that could not be established (refused, no route) sent nothing, so the request may be sent once more; (b) `initialize` and the proxy's own session re-establishment may be repeated (no session effect); (c) a request of a method that the MCP specification defines as read-only (`ping`, `tools/list`, `prompts/list`, `prompts/get`, `resources/list`, `resources/templates/list`, `resources/read`) may be retried once; (d) **any other request, in particular `tools/call`, is never sent again once any byte of it was written.** It is answered with JSON-RPC error `-32603`, `data.outcome: "unknown"` and a text that says its effect is unknown. The agent decides: it may send the call again with the `idempotency_key` it chose. The proxy never adds, removes or changes an `idempotency_key`. No error text contains the token (CLI-P6). | `conf::cli_ms2_initialize_session`, `conf::cli_ms2_retry_only_when_nothing_sent`, `conf::cli_ms2_no_replay_after_lost_reply`, `conf::cli_ms2_idempotency_key_untouched` |
