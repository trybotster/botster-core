# Core contract v1.17, Amendment 19 (candidate 2): a route's `max_frame_bytes` must carry every fixed-shape frame of that route
# | A19-1 | **A route's `max_frame_bytes` must be at least that route's floor.** It replaces A9-1's floor (the `attached` frame only).<br>- **The floor frames** are `attached`, `baseline_begin`, `modes`, `baseline_end`, `live`, `resync`, `route_closed`, `input_refused` and `input_done` without `path`, and `terminal_query` on a route that can be asked a query (`answers_queries` is true, EV-8). A later worker-to-client frame type that agrees with the three conditions of the term is a floor frame too.<br>- **Not floor frames:** `screen` and `history` (their own bounds, DP-3); `output` and `output_deflate` (the worker sets the payload length of each frame, DP-3); `output_dropped` (the worker shortens it to fit, Amendment 3, A3-1 item 4); `input_refused` and `input_done` with `path` (A19-2 checks each file before the worker creates it).<br>- **The widest value of each field:**<br>&nbsp;&nbsp;- a value that attach fixes (`features`, `terminal_format`, the applied limits): its exact value;<br>&nbsp;&nbsp;- `rows` and `cols`: the largest size that Amendment 2 allows (A2-1, `Size`);<br>&nbsp;&nbsp;- `ModeFlags`: each bool as `false`; `kitty_flags` at the largest value of the codec's bitset (A.6); each enum at its longest name that the worker sends; `other_modes` with every mode that the terminal model tracks and that has no normative field (E2-2), each as `false`. The tracked modes are the modes of the terminal model of the target worker's protocol version. Core knows that set for every worker protocol version that it supports, because it must know it to adopt such a worker (AD-4). No hello or handshake field is added;<br>&nbsp;&nbsp;- a name from a set (a reason, a `what` name, a query `kind`): its longest name that the worker sends;<br>&nbsp;&nbsp;- **`what` in `unsupported{what}`** is a name from the worker's own set: the names that Amendment 2 lists for `NotWritten(Unsupported{what})` (Amendment 2, the definitions of the IN-2 reasons, `core-contract-v1.17-amendment-2-candidate4.md`, line 80), and the codec's `utf8` (TS-5b). It never contains client text. So its longest name is known at attach;<br>&nbsp;&nbsp;- a part that a clause bounds by a value known at attach: that bound. For `terminal_query`, `request_bytes_base64` is the base64 of `max_query_bytes` bytes (EV-8), and `answer_within_ms` is the route's `query_deadline` in milliseconds;<br>&nbsp;&nbsp;- **`query_id` in `terminal_query`**: the worker mints it as a u64 and sends it as a decimal string, by the codec's rule for a u64 identifier (A.1: "A u64 identifier (request `id`, `op` in JSON) is sent as a **decimal string**."). So its widest value is the decimal string of the largest u64, `18446744073709551615` (20 digits). The width comes from the type, so this adds no number. A client still treats `query_id` as opaque and does not depend on its form (EV-8, A19-3 item 6);<br>&nbsp;&nbsp;- any other integer: the largest value that its clause allows, or the codec's integer range (A.1) when no clause gives one;<br>&nbsp;&nbsp;- an optional field: present.<br>- **The refusal does not change.** A smaller value is refused synchronously with `InvalidInput{field: route_limits.max_frame_bytes}`, before any route is reserved, as A9-1 and A7-1 state. Core computes the floor for the target worker at the call, as A9-1 computes the `attached` frame. A value equal to the floor is accepted.<br>- **A floor above the ceiling.** When the floor is larger than `CoreLimits.max_route_frame_bytes`, no value is valid. Every attach with those options is refused with the same sync `InvalidInput{field: route_limits.max_frame_bytes}`. `open` does not refuse that configuration. The reason: such a route could not decode its own frames. For example, a `CoreLimits.max_query_bytes` near `max_route_frame_bytes` (9B) gives this result on a route with `answers_queries: true`.<br>- The floor comes from the codec schema and from the route's own values, so this adds **no number**. Amendment 3 computes the worst-case minimum `output_dropped` frame the same way (A3-1 item 4). | `conf::a9_1_frame_cap_below_the_routes_attached_frame_is_invalid_input` (kept), `conf::a19_1_frame_cap_equal_to_the_floor_attaches_and_carries_its_baseline`, `conf::a19_1_frame_cap_one_byte_below_the_floor_is_invalid_input`, `conf::a19_1_every_floor_frame_at_its_widest_value_fits_the_floor`, `conf::a19_1_terminal_query_is_in_the_floor_only_when_the_route_answers_queries`, `conf::a19_1_floor_above_the_ceiling_opens_and_refuses_every_attach_with_those_options`, `conf::a19_1_query_id_is_a_u64_decimal_string` |
