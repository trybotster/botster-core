# Hub→plugin contract v1 — CANDIDATE v1.1 (2026-09-30, joint package J4e) > 25. Appendix C: manifest, scopes and Lua names (normative) > 25.1 Manifest
# | MN-2 | **Capabilities and scopes.** A grant is `{surface, scope?}`. `surface` is one of `mcp` (tools, prompts, resources; scopes `mcp_proxy` and `mcp_proxy_stdio`, bare only, MP-1), `surfaces` (routes and UI actions), `session_actions` (session handlers and the session scopes below), `events` (the event scopes below), `fs` (scope `fs:<root id>`, FS-1), `plugins` (scope `plugin_call:<owner>`, named \"call another plugin\", PC-1), `timers` (no scope: the grant for `timers.arm` and `timers.cancel`), `relay` (scope `relay_signaling`, bare only, named \"relay web client connections\", WP-2), `assets` (surface, scope `assets`, bare only, named \"publish web pages\", AS-1), `web_origin` (bare only, WP-1), `net_serve` (bare only, named \"serve web content\", WP-5), `net` (scope `net`, **with an `allow` list of origins or host patterns** that the operator approves, NT-2; scopes `net_private` and `net_inbound` are separate and named at approval: \"reach private networks\", \"receive local webhooks\"), `secrets` (no scope: the grant for `secrets.get`). A `scope` is `name` or `name:own` or `name:any`. **A bare `name` means `name:own`** (the plugin's own spawned sessions; for a target-scoped package, the sessions of its target, CP-8) for a session-filtered scope; `:any` needs operator approval at enable; a scope with no session subject accepts neither suffix. The owner names `own` and `any` are reserved so they never parse as a plugin key. **Scope table:** surface `session_actions` carries `session_read`, `session_observe`, `session_safe_write`, `session_write` (raw input, named as such at approval, never implied by `session_safe_write`), `session_stop`, `session_delete`, `session_update`, `session_screen`, `session_restart`, `session_type_spawn`, each `[:own\|:any]`, `process_run` (bare only, named \"run commands on this machine\", PX-4), `worktree_delete[:own\\|:any]`, `session_type_managed_git_spawn` and `session_create_command` (bare only, no suffix: they create sessions and act on none; `session_create_command` is named "run arbitrary commands" at approval); surface `events` carries `events_hub`, `events_plugin:<owner>`, `events_high` (none of these takes a suffix) and `events_terminal[:own\|:any]`, `session_output:read[:own\|:any]` (the raw-output tap). **Examples:** `{"surface": "session_actions", "scope": "session_write:any"}`, `{"surface": "events", "scope": "events_hub"}`, `{"surface": "events", "scope": "events_plugin:botster-orchestrator"}`, `{"surface": "events", "scope": "session_output:read"}`. **Own storage needs no entry:** the grant `plugin_db:<own>` named in Appendix A is **implied by the `storage.collections` declaration** (MN-1) and is never written in `capabilities`; a plugin with no declared collection is refused every `store.*` call with `capability_denied`. **Timers:** `{"surface": "timers"}`. A scope on the wrong surface, an unknown scope or a forbidden suffix fails the load `invalid_request{detail.code: manifest_bad_scope}`. | `conf::mn_2_scope_grammar`, `conf::mn_2_bare_scope_is_own`, `conf::mn_2_any_needs_approval`, `conf::mn_2_scope_on_wrong_surface_fails_load`, `conf::mn_2_no_suffix_on_subjectless_scope`, `conf::mn_2_reserved_owner_names`, `conf::mn_2_own_storage_implied_by_collections`, `conf::mn_2_timers_surface`, `conf::mn_1_botster_plugin_api_required` |
