# | EV-12 | **High is never silently lost.** Each subscriber has a **bounded loss ledger** (`loss_ledger_entries`, a Hub parameter) that holds gap obligations **outside the event queues**, so a marker never needs queue room. When the high queue is full the Hub does not enqueue further high copies for that subscriber, records them in the ledger, and delivers a gap marker for the affected names. **The gap is always explicit; recovery is promised only where a state read exists, and the marker says which.** Every gap carries **`recovery`**, computed **per subscriber** at the time of the gap: `state` only when **this subscriber has an actual permitted read** of an authoritative state, never because a source merely publishes one. A read is permitted when the subscriber holds the grant it needs (the Hub families, for the session family a fresh baseline, EV-6, or `sessions.list`; `operations.get` for the plugin's **own** operations; the plugin's **own** store for its own events; or **a state source the producer published** with the event declaration, named in `state_source`: **`state_source` is a descriptive read contract** (it names an existing entity family or an existing Hub call and the grant it needs; it **creates no new cross-plugin API and no reentry**), and it counts only if the subscriber holds that grant). **A gap with `recovery: state` carries the actionable descriptor `state_read`: `{surface: <existing call or entity family>, arguments?: {...}, reference?: {...}, grant: <scope>}`, the exact permitted read and the arguments or reference to use**, because a subscription has no `events.describe` call to fetch it. A descriptor names **a read-only, existing surface** and **never creates authority**; a gap aggregated across owners carries `recovery: partial` and **no descriptor** (no invented cross-plugin query). Examples: `hub/session_family` gaps are `state` only for a subscriber with `session_read`; a plugin with `events_hub` but no `session_read` gets `unavailable