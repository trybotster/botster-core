push subscription or endpoint.** Pointers stay inside the event payload; an entry with another kind of pointer fails the load `invalid_request{detail.code: manifest_bad_pointer}`. | `conf::vw_9_hub_evaluates_pointers_once_per_event`, `conf::vw_9_notice_event_shape_matches_client_sf5`, `conf::vw_9_client_evaluates_no_pointer`, `conf::vw_9_reaction_id_unique_within_plugin`, `conf::vw_9_plugins_only_event_cannot_produce_a_notice`, `conf::vw_9_hub_notice_is_not_a_reaction_source`, `conf::vw_9_push_only_reaction_never_in_app`, `conf::vw_9_in_app_only_reaction_never_pushed`, `conf::vw_9_push_payload_equals_stream_payload`, `conf::vw_9_notice_keeps_original_audience_at_dispatch`, `conf::vw_9_notice_id_shared_by_stream_and_push`, `conf::vw_9_two_untagged_notices_are_never_suppressed`, `conf::vw_9_client_dedupes_by_notice_id_only`, `conf::vw_9_delivery_in_app_and_push`, `conf::vw_9_tag_replaces_earlier_notice`, `conf::vw_9_bad_pointer_fails_load`, `conf::vw_9_subscription_never_reaches_plugin`, `conf::vw_9_subject_scope_and_source_grant_admission`, `conf::vw_9_ttl_and_value_type_admission`, `conf::vw_9_recipients_are_authorized_operators_only`, `conf::vw_9_delivery_is_an_upper_bound`, `conf::vw_9_tag_namespaced_by_plugin_and_reaction`, `conf::vw_9_notice_queue_overflow_is_counted_gap_on_the_notice_stream` | Parity audit G-11; client SF-5, SF-5b |
