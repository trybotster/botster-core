all staging is separate from enable bootstrap, so that "nothing executes at install" has one meaning (PD-9, PM-5). **A4r73 (Sol Hub B):** recursive exact schema comparison for arguments and results in the supported subset, applied to provider and interface alike (PD-3b); v1 interfaces are calls only (PD-3); `Hello.bindings` in HS-1; `plugins.call` dedupe includes the interface and the locked binding (PC-4). **A4r72 (Sol Hub B, plugin definition closure):** static admission versus Ready-time validation; declared exports and deterministic schema compatibility (PD-3, PD-3b); interface documents have a source, a locked hash and immutability; `plugins.call` addresses an interface and only tools of that interface; `Hello.bindings`; accepted breaking updates degrade consumers and refuse their calls; client arguments `bindings` and `accept_breaking` (PD-5, PD-6, PD-9). **A4r71 (user decision, plugin definition):** the plugin definition is a first-class part of the contract (section 25.3, PD-1 to PD-9): identity and semver, requirements (API, features, UI contract), provided and required interfaces with their own contracts and conformance fixtures, resolution in the package manager with the resolved set in the lockfile, load order, typed provider state for dependents, and validation before any code runs. **A4r70 (plan auditor):** `upgrade` preview is the separate read `preview_upgrade` (and hub `preview_package_upgrades`); client pin the Hub→client contract. **A4r69 (Sol Hub B):** package lifecycle rules: atomic commit and crash recovery, failures before and after handover, removed grants at handover, rollback revalidation, NT-2 on every fetch and per-install source approval, an exact content hash, and staged commit fixed across approval (PM-1, PM-3, PM-4, PM-7 to PM-9). **A4r68 (plan auditor):** package management names the client verbs (`install` as `create`, `upgrade`, `pin`, `unpin`, `rollback`, `approve_grants`, `remove` as `delete`, catalog `create`, `delete` and `refresh`, `package.manage` and `catalog.manage`); client pin the Hub→client contract. **A4r67 (joint revision):** client pin parity19; the no-direct-Hub-call boundary of a sandboxed frame now allows client-mediated declared actions (UI-EM-5) (AS-3, VW-10); the context file carries the bare context names and `session_type_dir` by reference to client MC-1c (CA-14). **A4r66 (user decision, package management):** section 9.14, PM-1 to PM-14: local, git and catalog sources, a lockfile with content hashes, install, update with a preview, pin, rollback, enable, disable, remove and status, integrity before load, the Hub fetches and runs no plugin code at install, new grants need approval, agent definitions and accessories on the same model, repo-scoped packages on the same model. **A4r65 (Sol Hub B):** one policy actor per path and no duplicate notification for an attached client; `events_hub` alone never grants `hub/session_notification` (EV-9, CA-22). **A4r64 (plan auditor):** `hub/session_notification` has no `prompt` source (Core does not detect prompts); client pin parity17. **A4r63 (plan auditor, UC-1):** the Hub event `hub/session_notification` is in the catalog with its audience and plugin access (EV-9); client pin parity16. **A4r62 (Sol Hub B):** the `Referrer-Policy` note is narrowed to automatic `Referer` disclosure (AS-3). **A4r61 (Sol Hub B):** `max_relay_envelope_bytes` is bounded by `max_frame_bytes`, with no invented range; the assets guarantee is stated as the credential and Hub-call boundary, not network confinement, and asset responses carry `Referrer-Policy: no-referrer` (AS-3). **A4r60 (plan auditor):** web plugin ICE servers (WP-6); the spawn arguments `prompt` and `context` with delivery by reference to client MC-1c (CA-14); the asset open verb is the client UI-EM-7 `open_asset` (AS-2); client pin parity12. **A4r59 (kit writer):** `asset_open` names the verb and resolves a name at open; a page is one self-contained asset; the assets origin is https or loopback http, with the Private Network Access header and a real-browser acceptance item (AS-1, AS-2). **A4r58 (Sol Hub B, parity auditor):** relay attempt start, registration and retirement, relay queue class and limits (WP-2, WP-4); no `@` in a plugin name and duplicate-key rejection (CP-8); spawn `context` schema delivered as `BOTSTER_CONTEXT_FILE` (CA-14); the legacy `port_forward` marker maps to `allocate_port` (CA-20); CSP reference (AS-3). **A4r57 (Sol Hub B):** the relay adopts client PR-4 to PR-9 exactly with no extra cipher, and the served-code trust is stated (WP-2, WP-3); asset lookup by name, authorized token minting and renewal, a script and style policy, and a durable-asset rule (AS-1 to AS-4); agents hold scoped permissions in LD-7 and EN-9; `crypto` integer and base64 size rule; web and asset limits in `Hello.limits`. **A4r56 (plan auditor):** each `relay_id` maps to its PR-4 connection and a plugin never chooses or reads the challenge (WP-2); safe and raw write serve clients and agents with the same semantics (SW-1); client pin parity11. **A4r55 (kit writer, user decision C):** plugin HTML is the `embed` view kind over `assets.publish` and staged assets served from a separate assets origin with capability tokens and sandbox headers (VW-10, AS-1 to AS-4; `frames` removed). **A4r54 (user decisions A to C):** the web plugin capability set (section 9.12: `web.set_origin`, an untrusted signalling relay for client signalling only, static serving from the plugin own origin); agents are clients with scoped, broad-by-default permissions (CP-9); sandboxed plugin HTML frames (VW-10); section 22 records all decisions. **A4r53 (Sol Hub B):** target-scoped packages: discovery location and triggers, staging before execution, required versus optional grants, the authenticated `<name>@<target_id>` key, the boundary over reads, mutations, spawn, subscriptions and actions, `:any` inside the target, removal (CP-8); `crypto` encodings, validation and failures, bounded by 