# Hub→plugin contract v1 — CANDIDATE v1.1 (2026-09-30, joint package J4e) > 10. Events
# | EV-2 | **Subscriptions (by event identity or pattern; declared; identity verified).** An event is named by **`{owner, name}`** (written `owner/name`), the same pair the Hub-client event streams use, with an optional **`subject`** (a `SessionRef` or resource reference). The Hub-owned owners are `hub` and `terminal`; a plugin's owner is its key. A plugin declares `events.subscribed` in `Ready`: each entry is `{handler_id, pattern: {owner, name}, subjects?: own\|any, min_priority?}`: **`handler_id`** names the registered `event` handler that receives the copies of that subscription (an entry with an unknown handler id fails the load); **`min_priority`** is ordered `low < normal < high`, **defaults to `low`** (every event of the pattern), and a copy below it is not delivered and not counted as lost; `subjects` narrows SessionRef-scoped events only (CP-4) and defaults to `own`. `events.gap_handler` (a handler id) is declared once beside `subscribed` (EV-15). In a pattern, `owner` or `name` may be `*` (any value) and `name` may end in `.*` (any name under that prefix); nothing else. **Each source needs a manifest permission** (CP-4): `events_hub`, `events_plugin:<owner>` (the producer must also have declared the event public and for the `plugins` audience, CP-6), `events_terminal` (metadata, own sessions or `:any`), `session_output:read` (the raw tap, EV-14). **Two checks stay distinct.** (1) **Source and subject permission** is checked against the **source** of a pattern (the owner and the subject scope), **at load**: a pattern whose owner or subject scope the plugin has no grant for is refused `capability_denied`, never narrowed silently; the check does not depend on which names exist. (2) **Audience eligibility** is checked **per event name, whenever a producer declares or reloads names**: a foreign subscriber matches a name only if the producer declared it `public` for the `plugins` audience (CP-6); a **private or non-`plugins` name never matches a foreign pattern**, however wide the wildcard, and its events are never delivered or counted in any marker of that subscriber. **A subscriber never prevents or delays a producer's registration or reload**: new names enter existing matches only if eligible, and a name that is not eligible is simply not matched. The Hub records the **verified subscriber identity** (plugin key and generation) with every subscription. | `conf::ev_2_pattern_grammar`, `conf::ev_2_each_subscription_names_a_registered_handler`, `conf::ev_2_min_priority_order_and_default`, `conf::ev_2_subjects_filter_narrows_session_events_only`, `conf::ev_2_source_permission_checked`, `conf::ev_2_pattern_wider_than_grant_refused_at_load`, `conf::ev_2_producer_reload_private_name_never_matches_wildcard`, `conf::ev_2_subscriber_cannot_block_producer_registration`, `conf::ev_2_grant_check_and_audience_check_are_distinct`, `conf::ev_2_gap_markers_never_name_private_events`, `conf::ev_2_subscriber_identity_recorded` | Today, widened by the 2026-09-30 user requirement; Hub-client section 8 vocabulary |
