# | SW-4 | **Probe, echo and erase (the hidden-composer check).** After the gate passes, the Hub writes the probe (`probe_text`, a Hub parameter: 1 to 8 printable ASCII characters) and waits at most `echo_deadline_ms` for the terminal model to echo it. **Echo seen:** after the same verification as the late cleanup (no client input since the probe, the cursor row text before the cursor ends with exactly the probe at the expected column, the modes are unchanged), the Hub erases the probe **as the one guarded transaction below, with the `model_rev` read at that verification**, with **one semantic key payload**, `Key{named: backspace, event: press, repeat: probe_width}` (Core IN-9 `repeat`, at most Core's `max_key_repeat`), so the encoding follows the terminal modes at write time and the Hub encodes no key bytes. **The erase is one Core input transaction** (Core writes the press `repeat` times contiguously in one write, AM-2), **guarded once at its start** with the original frozen input revision and the checked `model_rev`, so a redraw between key presses cannot let a later press erase unrelated data, then writes the text once (SW-7) and completes `delivered` when **Core acknowledges the text write**. **No echo within the deadline: the Hub types none of the requested text and sends no erase** (the probe itself was a real write) (there is nothing to erase, and the target may be a password prompt, a dialog or a hidden composer); **the attempt ends at `echo_deadline_ms` as not delivered (`abandoned{no_echo}`), and the Hub makes no retry of the text inside the operation**; only the late cleanup of the probe (below) continues. A plugin that still wants the text typed issues a **new** `safe_write` (a new operation and a new probe). A session that cannot pass the gate is `abandoned{not_safe_in_time}` after `write_max_wait_ms`, before any probe. **Residue is tracked per probe:** each probe written in the operation stays uncertain until **a confirmed erase resolves that probe**; the operation reports `residue: none` only when **every** probe it wrote is resolved (confirmed erased in the normal path or by the late cleanup), and never claims `none` while any other probe remains unresolved. Every completion of a `safe_write` that wrote the probe reports `probe_written: true` and `residue: none | possible`** (`possible` when no echo was seen, a human edge interrupted the attempt, or the erase was refused by the guard), and `text_written_bytes` (0 unless the text was written), so a plugin and an operator see exactly what reached the terminal. Every Hub write of the attempt (probe, erase, text) is a **Core guarded write** (Core IN-10) carrying **one client-input revision frozen before the probe and reused unchanged for the probe, the erase and the text; the Hub never refreshes that fence during the attempt**, so an erase or text after a human edge cannot pass with a newer revision, so **a client frame **received by the worker** before the write starts (Core IN-10; a client frame counts even if later refused or cancelled) makes Core refuse the write** and the Hub completes `abandoned{human_input}`, **never erasing a human's input**. **Late cleanup (ruling B).** (1) If the echo is not confirmed by `echo_deadline_ms`, nothing further is typed and the attempt ends as not delivered. (2) If the echo arrives after `echo_deadline_ms` but within `cleanup_window_ms` (Hub parameter, measured from the probe write), the Hub erases the probe then, **only if all three hold at the erase:** (a) no client or human input has entered the session since the probe (the original frozen fence, never refreshed); (b) the cursor row's text before the cursor still ends with exactly the probe bytes, at the column where the probe started plus the probe width; (c) the modes (alternate screen, bracketed paste) are unchanged since the probe. Otherwise it does **not** erase. **The checks must hold at the actual erase, not only when the Hub read them:** the Hub reads the terminal state and its **terminal revision** (`terminal_state.model_rev`, Core's opaque `model_rev` (Core ST-1), which advances on output, cursor, screen, resize, mode, title and cwd changes; equal tokens guarantee nothing read-visible changed, unequal tokens prove nothing, so a mismatch is a conservative `Stale`) **at the moment it verifies (b) and (c)**, and sends the erase as a Core guarded write carrying **both** the frozen client-input revision and **that `model_rev`**; **Core checks both at write start** and refuses the erase `NotWritten(Stale)` with zero bytes if the terminal changed after the Hub's read (a redraw, a mode change, more output). A parent-side recheck alone is not enough. **Core side (accepted, Core draft 47, IN-10):** `WriteInput.guard: Guard{input?, model_rev?}`, both checked at write start atomically with AM-2 ordering; the Hub reads `model_rev` with modes, size and cursor from Core's atomic read (Core ST-7). A program that keeps producing output keeps moving `model_rev`, so the erase stays refused until it is quiet; that is the intended safe behavior. (3) **Residue can remain only in:** (i) the human-input race (a guard fails because of human input); (ii) a session that never echoes within `cleanup_window_ms` (the probe bytes reached the program's input, stated explicitly); (iii) a guard failing for a non-human reason (the program redrew the line). The completion reports `residue: none | possible` and **never claims `none` unless the erase was confirmed, or the echo was confirmed and erased in the normal path**; a refused or partial cleanup is reported as `possible` or `unknown`. (4) **The Hub never erases anything it did not verifiably write, and never erases human input.** Observation cannot prove no partial line exists. | `conf::sw_4_probe_echo_erase`, `conf::sw_4_no_echo_types_nothing_and_no_erase`, `conf::sw_4_non_echoing_sink_receives_nothing` (the sink sees only the probe, never the text), `conf::sw_4_echoing_sink_receives_text` (positive), `c