# Hub→plugin contract v1 — CANDIDATE v1.1 (2026-09-30, joint package J4e) > 25. Appendix C: manifest, scopes and Lua names (normative) > 25.2 Lua names
# | LN-1 | **One rule.** The Lua name of host call `module.call` (Appendix A) is **`botster.<module>.<call>`**, taking **one table** and returning **one table**: `{ok = true, value = <result>}` or `{ok = false, error = {kind = <kind>, detail = {code = ...}, effect = <none\|committed\|unknown>?}}` (a refusal is returned, never raised). Argument and result field names are exactly those of Appendix A. `botster.log.<level>{message, fields?}` is sugar for `log.write`. **Host-local (no call):** `botster.json.encode` and `decode`, `botster.base64.encode` and `decode`, `botster.crypto.sha256`, `botster.crypto.hmac_sha256` and `botster.crypto.random_bytes`, `botster.ids.new{}`, `botster.clock.now` and `monotonic` (section 17). **Registration:** `botster.register{...}` (builds `Ready`), `botster.events.on(pattern, opts?, fn)`, `botster.events.on_gap(fn)`, `botster.operations.on(fn)`, `botster.webhooks.on(path, fn)` (NT-7), `botster.relay.on(fn)` (WP-2), `botster.fs.on_watch(handler_id, fn)` (FS-3). A Lua byte string maps to `bytes_b64` (`botster.base64`). **`events.on`, `events.on_gap`, `operations.on`, `webhooks.on(path, fn)`, `relay.on(fn)` and `fs.on_watch(handler_id, fn)` are load-time registration helpers only (the only `botster.*` names that are not host calls)**: they build the `Ready` registration, and a call after `Ready` fails `invalid_request{detail.code: registration_after_ready}` (there is no dynamic subscription in v1). | `conf::ln_1_name_rule`, `conf::ln_1_result_shape`, `conf::ln_1_refusal_returned_not_raised`, `conf::ln_1_registration_after_ready_fails` |
