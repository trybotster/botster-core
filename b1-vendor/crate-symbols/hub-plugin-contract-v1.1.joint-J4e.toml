# Hub→plugin contract v1 — CANDIDATE v1.1 (2026-09-30, joint package J4e) > 25. Appendix C: manifest, scopes and Lua names (normative) > 25.3 The plugin definition (identity, requirements, dependencies)
# | PD-8 | **Provider state reaches dependents, and never crashes them.** The Hub delivers the Hub event **`hub/plugin.dependency {interface, provider, state: available \| unavailable \| replaced}`** (subject: the consumer; priority `high`; a consumer receives it under `events_hub`) whenever a provider it requires is loaded, unloaded, crashed or replaced. **A lost `available` or `unavailable` has a defined recovery:** its gap carries `recovery: state` with `state_read` **`plugins.bindings`** (below), and **a consumer reads its current bindings and their states with `plugins.bindings{}` -> `{bindings: [{interface, interface_version, provider, provider_version, interface_hash, state: available \| unavailable \| unmet}]}`**, a read with no grant, answering only the caller's own bindings (also allowed in the bootstrap phase, HS-7). While a required provider is `unavailable` the **consumer is `degraded{interface}`** (status, PM-10), and **`plugins.call` to it is `unavailable{detail.code: provider_unloaded}`**; **the consumer is never unloaded, stopped or crashed by the loss of its provider.** When the provider returns, the consumer is told (`available`). **Revalidation at a provider handover:** when a provider package is upgraded, the Hub **revalidates each consumer's binding against the new `interface_version`**: if it is still in the consumer's range the binding is updated (the new `interface_version` and `interface_hash` are recorded and `available` is delivered); if not, the consumer becomes `degraded` with `requirement_unmet` (PD-6). **A consumer recovers from `degraded` only when the same bound provider satisfies its range again**; **the Hub never silently chooses a different provider and never grants authority**: a different provider, or one whose derived `plugin_call` grant differs, needs a new resolution and approval by a caller (`bindings`, PM-8). | `conf::pd_8_provider_unload_tells_dependents_with_a_typed_state`, `conf::pd_8_call_to_a_missing_provider_is_unavailable_not_a_crash`, `conf::pd_8_consumer_is_degraded_not_unloaded`, `conf::pd_8_provider_return_is_delivered`, `conf::pd_8_lost_dependency_event_recovers_through_plugins_bindings`, `conf::pd_8_plugins_bindings_answers_only_the_callers_own_bindings`, `conf::pd_8_handover_revalidates_each_consumer_binding_against_the_new_interface_version`, `conf::pd_8_recovery_only_with_the_same_bound_provider`, `conf::pd_8_no_silent_provider_switch_and_no_new_authority` |
