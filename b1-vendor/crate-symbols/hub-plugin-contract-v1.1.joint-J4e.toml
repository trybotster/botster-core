# Hub→plugin contract v1 — CANDIDATE v1.1 (2026-09-30, joint package J4e) > 10. Events
# | EV-13 | **Normal and low loss is exact, and the ledger is bounded.** **Normal:** an event declared with a `key` (the `subject` or an application key) **coalesces** per `(owner, name, key)`: the queue holds the latest value and the ledger counts the copies lost; **coalescing removes the older keyed copy and appends the latest copy at its new emit position** (never an in-place replace): emits A1, B2, A3 of keys A and B leave B2 then A3, so EV-10 order holds; an unkeyed event **drops the oldest** when full. **Low:** drops the **oldest**. **Ledger:** one entry per `(owner, name, subject?)` with **separate exact counters `lost_events` (copies) and `lost_bytes` (tap bytes)**, never added together; a marker carries both (`count` is `lost_events`). **Ordering:** the marker `event_gap{owner, name, subject?, count}` is delivered **at the position of the first copy lost since that name's last marker**; later losses add to its count before delivery. **When the ledger is full**, entries **aggregate exactly and never drop**: first per owner (`name: "*"`, `aggregated: true`, the summed count), then into one `owner: "*"` entry with `aggregated: true`; an aggregated gap carries **`recovery: partial`**, because the subscriber can no longer tell which names lost copies and must treat each name of the aggregated owner by that owner's state contract (some may be `unavailable`). **Counts stay exact under aggregation, per unit:** an aggregate sums `lost_events` with `lost_events` and `lost_bytes` with `lost_bytes`; byte loss of `terminal/output` is never folded into an event-copy count. | `conf::ev_13_normal_coalesces_by_key`, `conf::ev_13_normal_unkeyed_drops_oldest_with_count`, `conf::ev_13_low_drops_oldest_with_count`, `conf::ev_13_marker_at_first_loss_position`, `conf::ev_13_ledger_aggregates_exactly_when_full`, `conf::ev_13_aggregated_gap_is_recovery_partial`, `conf::ev_13_ledger_is_bounded`, `conf::ev_13_mixed_unit_aggregation_keeps_events_and_bytes_separate`, `conf::ev_13_keyed