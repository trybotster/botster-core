# Hub→plugin contract v1 — CANDIDATE v1.1 (2026-09-30, joint package J4e) > 25. Appendix C: manifest, scopes and Lua names (normative) > 25.3 The plugin definition (identity, requirements, dependencies)
# | PD-9 | **Validation, in three stages, each with one meaning.** **(A) Static admission, at install and update (the package manager's staging, PM-5): no plugin code runs.** The Hub validates in this order: (1) the **manifest schema** (MN-1); (2) **identity** (PD-1); (3) **`botster_plugin_api`**, **features** and **`ui_contract`** (PD-2); (4) the **declared exports** against each interface document (PD-3, PD-3b); (5) **resolution**: the `requires` bindings (PD-6, including the caller's `bindings` choices) and **the dependency graph** (PD-5 to PD-7); (6) the **grants, including the `plugin_call:<owner>` grants that PD-5 derives from the resolved providers**, are computed from the **resolved** bindings; (7) their **approval** (MN-2, PM-8). **(B) Enable bootstrap, when the package is enabled:** the plugin's entrypoint runs in the bootstrap phase (HS-7), and **the tools, handlers and events that it actually registers in `Ready` must match its declared exports**, else the registration is rejected before `Activated` (HS-2) and the package is `errored`. **(C) Runtime.** **\"Nothing executes at install\" means exactly (A):** installing, staging and updating run no plugin code and no conformance fixture; plugin code first runs at (B), after approval. **The first failure in a stage ends it with its typed reason.** | `conf::pd_9_static_admission_order_resolves_before_deriving_and_approving_grants`, `conf::pd_9_derived_plugin_call_grants_computed_from_resolved_bindings`, `conf::pd_9_no_code_runs_at_install_or_staging`, `conf::pd_9_ready_registration_must_match_the_declared_exports`, `conf::pd_9_mismatch_at_ready_rejects_before_activated`, `conf::pd_9_first_failure_reports_its_typed_reason` |
