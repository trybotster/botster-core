# Clause attribution for ids that sit in prose under a heading that names no clause.
# An override applies to an id that the extractor cannot attribute, and only to such an id.
# An override that matches no such id fails the ledger command, so this table cannot rot.
# `id_prefix` is matched against the id including the `conf::` prefix.
[[clause_override]]
id_prefix = "conf::a8_3_chunk_payload_is_at_most_max_chunk_bytes"
clause = "A8-3"
note = "HC A8 candidate 3: the Supersedes paragraph names the id before its A8-3 table row"

