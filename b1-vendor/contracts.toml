# The current contract set (docs/foundation-design.md section 2). Input to `cargo xtask ledger`.
#
# Contracts are listed in owner order. An id that several files name is owned by the first file in this order,
# and the other files go to `also_in`. The codec file comes before HC, so the codec owns a codec id.

