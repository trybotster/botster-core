# `allow-invalid` on the rand and getrandom entries: a crate that does not depend on them has no such function to find.
# Lints for the machine crates (plan 2.3c). Every crate below this directory uses this file unless
# its own directory has a clippy.toml: the drivers, `botster-core-sys`, the testkit and `xtask` carry their
# own, because they own the real edges (plan 2.3c: "The drivers, the sys crate and the testkit are exempt").
# Every one of those files repeats the five signal entries: no crate is exempt from the pattern rule.

