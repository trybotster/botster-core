# cargo-mutants settings (plan section 8, step 8). The gate reads this file.
#
# A mutant that the tests do not catch is a review finding. A mutant that cannot change behavior (an equivalent mutant) or that
# lives in process glue is recorded in `exclude_re` with the reason on the lines above the entry. The reviewer judges the
# reason. Never add an entry to make a job pass.
#
# Every decision of xtask is mutation-tested (the gate order, the caps, the lists rules, the taint and timer scans, the
# budgets, the snapshot comparison). Only the glue that starts a process, reads a file or prints is excluded, per function.

# Test code is not mutated: the tests are the checks.
exclude_globs = ["**/tests/**", "tests/**"]

exclude_re = [
    # fsutil: wrappers of `git` and `cargo metadata` and of one environment variable. They return the data that the pure checks judge; a
    # replaced body is seen by a real `cargo xtask ci` run, not by a unit test. The decision `base_ref_from` is mutation-tested.
    'xtask/src/fsutil\.rs:\d+:\d+: (replace (repo_root|tracked_files|git_show|resolves|metadata|base_ref)( ->| with)|.* in (repo_root|tracked_files|git_show|resolves|metadata|base_ref)$)',
    # tools: process spawning (cargo, rustup) with inherited output. No decision is in them; `caps::apply` (tested) caps every cargo child.
    'xtask/src/tools\.rs:\d+:\d+: (replace (run|cargo|cargo_nightly|ensure_nightly|require_cargo_tool)( ->| with)|.* in (run|cargo|cargo_nightly|ensure_nightly|require_cargo_tool)$)',
    # main: the dispatch of command names to functions, and the process exit.
    'xtask/src/main\.rs:\d+:\d+: (replace (main|run)( ->| with)|.* in (main|run)$)',
    # caps::require: reads two environment variables. The decision is `problems` and `refusal`, which are mutation-tested.
    'xtask/src/caps\.rs:\d+:\d+: (replace (require)( ->| with)|.* in (require)$)',
    # ci: each step function starts one tool (cargo, git, nextest, mutants, bolero) and passes its status on, and `command` prints.
    # The decisions are mutation-tested: `run_steps` (order, stop, keep-going, one step), `summary_line`, `parse_options`,
    # `changed_crates`, `harnesses_to_run`, `passed_count`, `parse_outcomes`.
    'xtask/src/ci\.rs:\d+:\d+: (replace (fmt_job|clippy_job|taint_job|lists_job|conformance_report|public_api_job|prebuild_job|test_budget_job|slow_job|changed_paths|base|mutants_job|fuzz_job|command)( ->| with)|.* in (fmt_job|clippy_job|taint_job|lists_job|conformance_report|public_api_job|prebuild_job|test_budget_job|slow_job|changed_paths|base|mutants_job|fuzz_job|command)$)',
    # lists: reads the three files, the pinned ledger and the base ref, then prints. Every decision is in `check`, `pin_moved`, `report`,
    # `ledger_text`, `contracts_tag` and the parsers, which are mutation-tested.
    'xtask/src/lists\.rs:\d+:\d+: (replace (command|ledger_ids_command)( ->| with)|.* in (command|ledger_ids_command)$)',
    # taint: reads the tracked files and prints. The decisions are `hits_in_line` and `scan_files`, which are mutation-tested.
    'xtask/src/taint\.rs:\d+:\d+: (replace (command)( ->| with)|.* in (command)$)',
    # timers: reads the tracked files and prints. The decisions are `scan`, `scan_files`, `test_lines` and `marked`, which are mutation-tested.
    'xtask/src/timers\.rs:\d+:\d+: (replace (command)( ->| with)|.* in (command)$)',
    # prebuild: runs `cargo build` and `cargo install` and copies the result. The decisions are mutation-tested: `has_worker_binary`,
    # `install_executable`, `contracts_source`, `manifest_text`, `sha256_hex`.
    'xtask/src/prebuild\.rs:\d+:\d+: (replace (build_worker|build_probe|command)( ->| with)|.* in (build_worker|build_probe|command)$)',
    # public_api: runs `cargo public-api` and reads one file. The decision `first_difference` is mutation-tested.
    'xtask/src/public_api\.rs:\d+:\d+: (replace (command)( ->| with)|.* in (command)$)',
    # test_budget: starts nextest in its own process group, tracks and kills its processes, and prints. The decisions are mutation-tested:
    # `exit_failures`, `budget_failures`, `doublings`, `parse_junit`, `parse_options`, `parse_duration`, `selection`, `tier_env`.
    'xtask/src/test_budget\.rs:\d+:\d+: (replace (run_nextest|clean_up|kill|command|analyse)( ->| with)|.* in (run_nextest|clean_up|kill|command|analyse)$)',
    # botster-core-testkit process_group: process glue of a real process group (BUILD.md testing rule 10), per function. `spawn`
    # starts the child as a group leader; `pid`, `take_stdin`, `take_stdout`, `take_stderr` and `is_active` are accessors over the
    # child and the retained group id; `leader_exited` and `wait_for_leader_exit` call `waitid` (their `|` joins disjoint option
    # flags, so `^` gives the same value: equivalent; `&` drops the flags and changes the call, which only a slow test that
    # blocks on the wait would see); `kill` and `drop` signal the group and reap the leader.
    # They start or signal real processes, which the default tier of this run never does. The slow-tier tests
    # `tests/slow_process_group.rs` exercise `spawn`, `pid`, `take_stdout`, `leader_exited`, `wait_for_leader_exit`, `is_active`,
    # `kill` and `drop`; `take_stdin` and `take_stderr` are the same one-line `Option::take` as `take_stdout` and no slow test calls
    # them. A pure decision added to this file later is not covered by this entry: it must be tested in the default tier.
    'crates/botster-core-testkit/src/process_group\.rs:\d+:\d+: (replace OwnedGroup::(spawn|pid|take_stdin|take_stdout|take_stderr|leader_exited|wait_for_leader_exit|is_active|kill)( ->| with)|.* in OwnedGroup::(spawn|pid|take_stdin|take_stdout|take_stderr|leader_exited|wait_for_leader_exit|is_active|kill)$|replace <impl Drop for OwnedGroup>::drop)',
    # botster-core facade: `impl CoreApi for Core` forwards each call to `HostDriver`, with no decision of its own (plan 2.1: the
    # facade only wires real edges). Opening a `Core` starts a process that links the whole crate, so the proof is in the slow
    # tier: `slow_tests::every_call_reaches_the_driver` (lib.rs) calls each method on a real `Core` and checks its result. The
    # behavior behind each method is mutation-tested in `botster-core-host` (`HostDriver`, `HostEngine`).
    'crates/botster-core/src/lib\.rs:\d+:\d+: replace <impl CoreApi for Core>::',
    # botster-core real edges: OS wiring with no decision of its own (a descriptor, a socket, a poll, a row call). The decisions
    # (`wake_after`, `interest_of`, `registration`) are in pure functions that are mutation-tested. The slow tier proves the rest
    # with real descriptors, in `slow_tests`: `the_edges_keep_rows_in_the_registry` (write_row, read_rows, delete_row),
    # `the_edges_draw_random_bytes_and_refuse_the_handoff` (fill_random, handoff_route, poll_process_exit, accept_link),
    # `a_link_reads_writes_and_closes` (accept_link, link_recv, link_send, link_close, set_read_interest, set_write_interest,
    # LinkIo::apply), `the_socket_lives_with_the_edges` (socket_path, Drop), `the_wake_follows_its_flag` (PollWake::*,
    # settle_wake), and in tests/slow_real_core.rs: `a_worker_that_exits_before_it_connects_ends_the_start_at_once`
    # (spawn_worker, signal_group, poll_process_exit, the reaper wake) and `a_hello_for_an_unknown_instance_is_closed`
    # (the listener token, accept_link, link_close).
    'crates/botster-core/src/real\.rs:\d+:\d+: (replace (<impl (HostEdges for RealEdges|WakeHandle for PollWake|WakeEdge for PollWake|Drop for RealEdges)>::|PollWake::consume|socket_path|LinkIo::apply)|delete ! in <impl WakeHandle for PollWake>::wait$)',
    # The helpers of the tests that live in a source file (`slow_tests`) are test code: the tests are the checks.
    'crates/botster-core/src/(lib|real)\.rs:\d+:\d+: .*slow_tests::',
    # real.rs: the token of the listener is `usize::MAX - 1`, and `a_hello_for_an_unknown_instance_is_closed` fails when it equals
    # the token of the waker. The number of a link counts up from 1: `a_link_reads_writes_and_closes`.
    'crates/botster-core/src/real\.rs:\d+:\d+: replace - with /$',
    'crates/botster-core/src/real\.rs:\d+:\d+: replace \+= with [-*]= in <impl HostEdges for RealEdges>::accept_link$',
    # real.rs: an `accept` that the kernel interrupts (`EINTR`) is tried again. A test cannot make the kernel interrupt a call on
    # command; the match guard has the two outcomes of `io::ErrorKind` and no other logic.
    'crates/botster-core/src/real\.rs:\d+:\d+: replace (match guard e\.kind\(\) == io::ErrorKind::Interrupted with (true|false)|== with !=) in <impl HostEdges for RealEdges>::accept_link$',
    # botster-core-sys process: the wrappers of the operating system. `Children` waits for a child, reaps it and signals a group:
    # a real child process is needed, so the proof is in the slow tier: `a_child_exit_calls_the_notifier_and_is_polled`
    # (poll_exit, wait_exit), `the_worker_control_signal_reaches_the_worker_handler` and
    # `a_spawned_child_matches_its_identity_and_dies_by_the_group_kill` (signal_group, kill_group).
    'crates/botster-core-sys/src/process\.rs:\d+:\d+: (replace Children::(poll_exit|wait_exit|signal_group|kill_group)( ->| with)|.* in Children::(poll_exit|wait_exit|signal_group|kill_group)$)',
    # botster-core-sys process: `start_time` of macOS is `cfg(target_os = "macos")` code: the Linux gate does not compile it,
    # so a mutant in it cannot change a test result there. Only equality has a meaning (AD-6), and the macOS slow tier runs
    # `a_spawned_child_matches_its_identity_and_dies_by_the_group_kill`.
    'crates/botster-core-sys/src/process\.rs:\d+:\d+: replace [*+] with [-+*/] in start_time$',
    # Equivalent mutants of `botster-core-host`: a change that no behavior can show.
    # - `check_payload`: the `Focus` arm is `{}`, the same as the arm for every other kind (`_ => {}`).
    # - `commit`: `Stop` of a session that is `Starting` while its flow is idle, and `Flow::Create | Flow::Start` are the only
    #   flows that a `Starting` session has, so the guard `s.admit == Admit::Starting` of the last arms is never the deciding
    #   one: a `Starting` session always has a start or a create flow.
    # - `READ_CHUNK` (`16 * 1024`): the size of one read of a link. Frames are rebuilt from any chunk size; only the number of
    #   system calls changes.
    'crates/botster-core-host/src/admit\.rs:\d+:\d+: delete match arm InputPayload::Focus\{\.\.\} in HostEngine::check_payload$',
    'crates/botster-core-host/src/admit\.rs:\d+:\d+: replace match guard s\.admit == Admit::Starting with false in HostEngine::commit$',
    'crates/botster-core-host/src/driver\.rs:\d+:\d+: replace \* with \+$',
]
