    # xtask (P0): one entry per function; the reason of each group is on the lines above its entries.
    # fsutil: wrappers of `git` and `cargo metadata` and of one environment variable. They return the data that the pure checks judge; a
    # replaced body is seen by a real `cargo xtask ci` run, not by a unit test. The decision `base_ref_from` is mutation-tested.
    'xtask/src/fsutil\.rs:\d+:\d+: (replace repo_root( ->| with)|.* in repo_root$)',
    'xtask/src/fsutil\.rs:\d+:\d+: (replace tracked_files( ->| with)|.* in tracked_files$)',
    'xtask/src/fsutil\.rs:\d+:\d+: (replace git_show( ->| with)|.* in git_show$)',
