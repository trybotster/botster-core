# cargo-mutants settings (plan section 8, step 8). The gate reads this file.
#
# A mutant that the tests do not catch is a review finding. A mutant that cannot change behavior (an equivalent mutant) or that
# lives in process glue is recorded in `exclude_re` with the reason on the lines above the entry. The reviewer judges the
# reason. Never add an entry to make a job pass.
#
# Every decision of xtask is mutation-tested (the gate order, the caps, the lists rules, the taint and timer scans, the
# budgets, the snapshot comparison). Only the glue that starts a process, reads a file or prints is excluded, per function.

# Test code is not mutated: the tests are the checks.
exclude_globs = ["**/tests/**", "tests/**"]

exclude_re = [
    # xtask mutants_job -> Ok(()): process glue. The body runs `git diff`, writes the diff file, starts `cargo mutants` and
    # prints its summary; a test cannot start a mutation run inside a mutation run, so no test can run the body. Only this
    # whole-body replacement is excluded: every other mutant of mutants_job stays tested. Its decisions are pure functions
    # with unit tests, which stay mutation-tested: mutation_verdict, the pass or fail of the step from the exit code
    # (only_a_mutation_run_with_every_mutant_caught_passes), parse_outcomes (the_mutation_summary_is_read_from_outcomes_json)
    # and platform_exclusions (only_a_gate_off_macos_adds_the_off_macos_exclusions). A body replaced by Ok(()) skips the
    # step without its summary line, which every gate log of the step shows ("mutants: N mutants: ...").
    'xtask/src/ci\.rs:\d+:\d+: replace mutants_job -> Result<\(\)> with Ok\(\(\)\)$',
    # P7 GuardianConfig::fmt: the debug text has no contract format. An empty successful
    # debug result still omits the service token, which is the only required property.
    # only_a_valid_host_hello_authenticates checks token omission.
    'crates/botster-guardian-core/src/guardian\.rs:\d+:\d+: replace <impl std::fmt::Debug for GuardianConfig>::fmt -> std::fmt::Result with Ok\(Default::default\(\)\)$',
    # P7 LOG_CHUNK_BYTES (tuning ruling, 2026-10-04): no clause fixes the log chunk size; SV-9 fixes the retained bytes.
    # `/` gives DEFAULT_MAX_PAYLOAD / 8, a smaller positive size. log_chunks_carry_every_byte_at_each_chunk_size proves
    # every byte, order, contiguous offsets and the link frame bound at the default, at that mutant value and at the
    # minimum 1. NonZeroUsize enforces the lower bound: a zero size fails const evaluation. `+` exceeds the frame bound
    # and stays killed. a_large_tail_streams_and_replays_before_the_status proves the default through the machine.
    # This entry covers only that constant's subtraction.
    'crates/botster-guardian-core/src/wire\.rs:80:52: replace - with /$',
    # P3 Driver READ_CHUNK: no clause fixes this positive read bound. Plan 2.5 rule 7 and A5-2 permit partial reads.
    # NonZeroUsize enforces positivity in all builds; a zero default fails const evaluation.
    # control_and_pty_reads_retain_bytes_at_each_positive_bound proves control-frame and program-byte retention
    # and readiness clearing at 65536, 1088, and 1 through the same Driver constructor and read functions.
    # The exact-head slow baseline also proves the shared Worker's launch, signal, exit, and removal through Driver.
