name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Zig 0.16.0
        run: |
          curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o zig.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  zig.tar.xz" | sha256sum -c -
          tar -xJf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings


      - name: Test workspace
        run: cargo test --workspace

      - name: Test contract-only core library
        run: cargo test -p botster-core --no-default-features --lib

      - name: Verify Ghostty cache isolation
        run: |
          test -e crates/botster-terminal-ghostty/vendor/ghostty/zig-out/lib/libghostty-vt.a
          test ! -e crates/botster-terminal-ghostty/vendor/ghostty/.zig-cache


      - name: Test docs
        run: cargo test --doc --workspace

      - name: Build docs
        run: cargo doc --workspace --no-deps

      - name: Node terminal protocol consumer smoke
        run: script/terminal-protocol-node-smoke.sh

      - name: Verify local PTY runtime
        if: runner.os == 'Linux'
        run: cargo test -p botster-core --test local_process_runtime_test

  release-verification:
    name: Release verification
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Zig 0.16.0
        run: |
          curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o zig.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  zig.tar.xz" | sha256sum -c -
          tar -xJf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Build release workspace
        run: cargo build --workspace --release
