[workspace]
resolver = "2"
members = ["crates/*", "xtask", "probe-bin"]
# PROBE ONLY (never merged): the R-46 transcript-fix conformance crate copy.
exclude = ["probe-contracts"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
# botster-contracts, by tag (plan section 0; contracts-v0.1.22 = af5771c, manifest-final37: Core Amendment 17 candidate 2, WebRTC moves to the Hub
# and Core has one route transport, `Stream`; HC Amendment 8, HP Amendment 9, codec rev37; Limits::real (R-43); the Stop-race transcripts;
# earlier: final36, Core Amendment 18 candidate 2; Core Amendments 13 to 16 in the crates, InvalidInput{field}; rulings R-30 to R-37).
botster-core-contract = { git = "https://github.com/trybotster/botster-contracts", tag = "contracts-v0.1.23" }
botster-conformance = { git = "https://github.com/trybotster/botster-contracts", tag = "contracts-v0.1.23" }
botster-core-conformance = { git = "https://github.com/trybotster/botster-contracts", tag = "contracts-v0.1.23" }
botster-route-codec = { git = "https://github.com/trybotster/botster-contracts", tag = "contracts-v0.1.23" }
botster-probe-script = { git = "https://github.com/trybotster/botster-contracts", tag = "contracts-v0.1.23" }
botster-test-support = { git = "https://github.com/trybotster/botster-contracts", tag = "contracts-v0.1.23" }

anyhow = "1"
data-encoding = "2"
bolero = "0.13"
getrandom = "0.4"
libtest-mimic = "0.8"
mio = { version = "1", features = ["os-poll", "os-ext", "net"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = "2"
rand_chacha = "0.9"
rand_core = "0.9"
schemars = "1"
regex = "1"
pty-process = "0.5.3"
rustix = { version = "1", features = ["event", "fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
signal-hook-mio = { version = "0.2", features = ["support-v1_0"] }
sha2 = "0.10"
static_assertions = "1"
tempfile = "3"
toml = "0.9"

# Crates of this workspace, once another crate depends on them.
botster-core = { path = "crates/botster-core" }
botster-core-edges = { path = "crates/botster-core-edges" }
botster-core-host = { path = "crates/botster-core-host" }
botster-core-link = { path = "crates/botster-core-link" }
botster-core-sys = { path = "crates/botster-core-sys" }
botster-core-testkit = { path = "crates/botster-core-testkit" }
botster-test-process = { path = "crates/botster-test-process" }
botster-worker-core = { path = "crates/botster-worker-core" }
botster-terminal-ghostty = { path = "crates/botster-terminal-ghostty" }

# The profile that `cargo bolero test` builds with: the landing fuzz step.
[profile.fuzz]
inherits = "dev"
opt-level = 3
incremental = false
codegen-units = 1

# PROBE ONLY (never merged): botster-core-conformance with the R-46 transcript fixes (contracts d4e3a8c).
[patch."https://github.com/trybotster/botster-contracts"]
botster-core-conformance = { path = "probe-contracts/crates/botster-core-conformance" }
