[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
# botster-contracts, by tag (plan section 0; contracts-v0.1.1 = 366bca4, manifest final14).
botster-core-contract = { git = "https://github.com/trybotster/botster-contracts", tag = "contracts-v0.1.1" }
botster-conformance = { git = "https://github.com/trybotster/botster-contracts", tag = "contracts-v0.1.1" }
botster-core-conformance = { git = "https://github.com/trybotster/botster-contracts", tag = "contracts-v0.1.1" }
botster-test-support = { git = "https://github.com/trybotster/botster-contracts", tag = "contracts-v0.1.1" }

anyhow = "1"
bolero = "0.13"
libtest-mimic = "0.8"
regex = "1"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
static_assertions = "1"
tempfile = "3"
toml = "0.9"

# Crates of this workspace, once another crate depends on them.
botster-worker-core = { path = "crates/botster-worker-core" }

# The profile that `cargo bolero test` builds with: the landing fuzz step.
[profile.fuzz]
inherits = "dev"
opt-level = 3
incremental = false
codegen-units = 1
