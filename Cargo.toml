[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
# botster-contracts, by tag (plan section 0; contracts-v0.1.2 = c236b59, manifest final14).
botster-core-contract = { git = "https://github.com/trybotster/botster-contracts", tag = "contracts-v0.1.2" }
botster-conformance = { git = "https://github.com/trybotster/botster-contracts", tag = "contracts-v0.1.2" }
botster-core-conformance = { git = "https://github.com/trybotster/botster-contracts", tag = "contracts-v0.1.2" }
botster-route-codec = { git = "https://github.com/trybotster/botster-contracts", tag = "contracts-v0.1.2" }
botster-probe-script = { git = "https://github.com/trybotster/botster-contracts", tag = "contracts-v0.1.2" }
botster-test-support = { git = "https://github.com/trybotster/botster-contracts", tag = "contracts-v0.1.2" }

anyhow = "1"
atomic-write-file = "0.3"
bolero = "0.13"
getrandom = "0.4"
libtest-mimic = "0.8"
mio = { version = "1", features = ["os-poll", "os-ext", "net"] }
rand_chacha = "0.9"
rand_core = "0.9"
regex = "1"
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
static_assertions = "1"
tempfile = "3"
toml = "0.9"

# Crates of this workspace, once another crate depends on them.
botster-core-edges = { path = "crates/botster-core-edges" }
botster-core-host = { path = "crates/botster-core-host" }
botster-core-link = { path = "crates/botster-core-link" }
botster-core-sys = { path = "crates/botster-core-sys" }
botster-core-testkit = { path = "crates/botster-core-testkit" }
botster-worker-core = { path = "crates/botster-worker-core" }

# The profile that `cargo bolero test` builds with: the landing fuzz step.
[profile.fuzz]
inherits = "dev"
opt-level = 3
incremental = false
codegen-units = 1
