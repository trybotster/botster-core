# Crates of this workspace, once another crate depends on them.
botster-core = { path = "crates/botster-core" }
botster-core-edges = { path = "crates/botster-core-edges" }
botster-core-host = { path = "crates/botster-core-host" }
botster-core-link = { path = "crates/botster-core-link" }
botster-core-sys = { path = "crates/botster-core-sys" }
botster-core-testkit = { path = "crates/botster-core-testkit" }
botster-test-process = { path = "crates/botster-test-process" }
botster-worker-core = { path = "crates/botster-worker-core" }
botster-terminal-ghostty = { path = "crates/botster-terminal-ghostty" }

# The profile that `cargo bolero test` builds with: the landing fuzz step.
[profile.fuzz]
inherits = "dev"
opt-level = 3
incremental = false
codegen-units = 1

# The checker of the conformance suite runs as test code in every default-tier test: the contracts' route driver turns each
# route frame into JSON with a hex payload and validates it. The four dependencies that the checker uses below are optimized
# in dev and test builds for speed; assertions and overflow checks kept (lead ruling, 2026-10-10:
# `conf::ou_3_progressing_reader_lossless` moves 1 MiB per seed through them). An override applies wherever the dev profile
# builds the package:
# - botster-route-codec and serde_json are production dependencies of Core crates (botster-core, botster-core-link,
#   botster-worker-core and others), so their dev-profile builds are optimized too;
# - regex-automata is also built for a production crate's build script (bindgen, which libproc of botster-core-sys uses);
# - botster-hub-conformance is a dependency of the testkit and the xtask only.
# Each override sets the opt-level and keeps the dev profile's debug assertions and overflow checks explicitly. No Core
# workspace crate has an override, so the mutation and coverage builds of Core code are unchanged.
[profile.dev.package.botster-hub-conformance]
opt-level = 2
debug-assertions = true
overflow-checks = true

[profile.dev.package.botster-route-codec]
opt-level = 2
debug-assertions = true
overflow-checks = true

[profile.dev.package.serde_json]
opt-level = 2
debug-assertions = true
overflow-checks = true

[profile.dev.package.regex-automata]
opt-level = 2
debug-assertions = true
overflow-checks = true

# The real-process tests verify each prebuilt candidate binary against its sha256 in target/candidate/manifest.json
# (botster-core-testkit candidate.rs `Candidate::locate`) before each harness. At the dev opt-level the hash ran at about
# 43 MB/s: 1.4 s per verification of the 60 MB debug worker, 99 % of the real conformance tier's time (GS L0 evidence,
# 2026-10-11: ~/botster-sessions/gates/botster-core-gs-l0-trace-7e8e07d6-evidence.log). sha2 is optimized in dev and test
# builds (lead ruling, 2026-10-11), under the conditions of the overrides above: the opt-level only, debug assertions and
# overflow checks kept, and no Core workspace crate. sha2 is also a production dependency (botster-core-link proof.rs).
[profile.dev.package.sha2]
opt-level = 3
debug-assertions = true
overflow-checks = true

# The contracts' conformance driver and step runner execute every step of every conformance transcript. A profile of
# `conf::in_9_legacy_keys_table` (contracts-v0.1.43: 311 steps; sampled at 1024 seeds, debug build) put about half of its time in these two
# crates: the generic code that they build (a BTreeMap<String, Value> clone per step, next_event, input_log_track, the matcher)
# ran at the dev opt-level, and the id went over its 2 s budget (gate on f16a10ba, node linux: 2.005 s; RC evidence
# in9-profile-f16a10ba-*). Both are dependencies of the testkit, the xtask and botster-core's tests only. They are optimized in dev and
# test builds (lead ruling, 2026-10-12), under the conditions of the overrides above: the opt-level only, debug assertions
# and overflow checks kept, and no Core workspace crate. Measured (Mac, BOTSTER_SEEDS=0-31): the id 1.72 s → 1.00 s; the
# strict conformance run, one thread, 28.40 s → 21.48 s.
[profile.dev.package.botster-core-conformance]
opt-level = 2
debug-assertions = true
overflow-checks = true

[profile.dev.package.botster-conformance]
opt-level = 2
debug-assertions = true
overflow-checks = true
