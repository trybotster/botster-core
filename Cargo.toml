[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
# botster-contracts, by tag (plan section 0; contracts-v0.1.13 = a8db5c9, manifest final30, Core Amendment 13 final).
botster-core-contract = { git = "https://github.com/trybotster/botster-contracts", tag = "contracts-v0.1.13" }
botster-conformance = { git = "https://github.com/trybotster/botster-contracts", tag = "contracts-v0.1.13" }
botster-core-conformance = { git = "https://github.com/trybotster/botster-contracts", tag = "contracts-v0.1.13" }
botster-route-codec = { git = "https://github.com/trybotster/botster-contracts", tag = "contracts-v0.1.13" }
botster-probe-script = { git = "https://github.com/trybotster/botster-contracts", tag = "contracts-v0.1.13" }
botster-test-support = { git = "https://github.com/trybotster/botster-contracts", tag = "contracts-v0.1.13" }

anyhow = "1"
atomic-write-file = "0.3"
bolero = "0.13"
getrandom = "0.4"
libtest-mimic = "0.8"
mio = { version = "1", features = ["os-poll", "os-ext", "net"] }
rand_chacha = "0.9"
rand_core = "0.9"
schemars = "1"
regex = "1"
pty-process = "0.5.3"
rustix = { version = "1", features = ["event", "fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
signal-hook-mio = { version = "0.2", features = ["support-v1_0"] }
sha2 = "0.10"
static_assertions = "1"
tempfile = "3"
toml = "0.9"

# Crates of this workspace, once another crate depends on them.
botster-core = { path = "crates/botster-core" }
botster-core-edges = { path = "crates/botster-core-edges" }
botster-core-host = { path = "crates/botster-core-host" }
botster-core-link = { path = "crates/botster-core-link" }
botster-core-sys = { path = "crates/botster-core-sys" }
botster-core-testkit = { path = "crates/botster-core-testkit" }
botster-worker-core = { path = "crates/botster-worker-core" }
botster-terminal-ghostty = { path = "crates/botster-terminal-ghostty" }

# The profile that `cargo bolero test` builds with: the landing fuzz step.
[profile.fuzz]
inherits = "dev"
opt-level = 3
incremental = false
codegen-units = 1
