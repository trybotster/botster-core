[package]
name = "botster-core-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The real-process tests of this crate (BUILD.md testing rule 2): `cargo xtask slow` runs them.
# It also builds `real::RealCoreHarness` (plan 4.2) over the real `Core::open` and the group guard of `botster-test-process`.
slow = ["dep:botster-core", "dep:botster-test-process", "dep:tempfile"]

[dependencies]
botster-core = { workspace = true, optional = true }
botster-test-process = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
botster-core-contract.workspace = true
botster-conformance.workspace = true
botster-core-conformance.workspace = true
botster-hub-conformance.workspace = true
botster-core-edges.workspace = true
botster-core-host.workspace = true
botster-core-sys.workspace = true
botster-core-link.workspace = true
botster-worker-core.workspace = true
botster-terminal-ghostty.workspace = true
botster-probe-script.workspace = true
botster-route-codec.workspace = true
rand_chacha.workspace = true
rand_core.workspace = true
rustix = { workspace = true, features = ["process"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true

[dev-dependencies]
schemars.workspace = true
tempfile.workspace = true
