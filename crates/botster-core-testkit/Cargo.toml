[package]
name = "botster-core-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The real-process tests of this crate (BUILD.md testing rule 2): `cargo xtask slow` runs them.
# It also builds `botster-test-anchor` and `real::RealCoreHarness` (plan 4.2).
slow = ["dep:botster-core", "dep:botster-core-sys", "dep:botster-test-support", "dep:signal-hook", "dep:kqueue"]

[dependencies]
botster-core = { workspace = true, optional = true }
botster-core-contract.workspace = true
botster-core-conformance.workspace = true
botster-core-edges.workspace = true
botster-core-host.workspace = true
botster-core-sys = { workspace = true, optional = true }
botster-core-link.workspace = true
botster-worker-core.workspace = true
botster-terminal-ghostty.workspace = true
botster-probe-script.workspace = true
botster-route-codec.workspace = true
rand_chacha.workspace = true
rand_core.workspace = true
rustix = { workspace = true, features = ["process"] }
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
botster-test-support = { workspace = true, optional = true }
signal-hook = { workspace = true, optional = true }

[dev-dependencies]
botster-conformance.workspace = true
schemars.workspace = true
tempfile.workspace = true

# The exit watch of the slow tests and their fixture on macOS (`EVFILT_PROC`); Linux uses `pidfd`.
[target.'cfg(target_os = "macos")'.dependencies]
kqueue = { version = "1.2.1", optional = true }

[[bin]]
name = "botster-test-anchor"
path = "src/bin/botster-test-anchor.rs"
required-features = ["slow"]
test = false

# The fixture processes of `tests/slow_real_harness.rs`: one binary, so that no fixture role counts as a test (audit A51).
[[bin]]
name = "botster-test-fixture"
path = "tests/bin/fixture.rs"
required-features = ["slow"]
test = false
