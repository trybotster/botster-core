[package]
name = "botster-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The real-process tests of this crate (BUILD.md testing rule 2): `cargo xtask slow` runs them.
# It also runs the conformance suite on `RealCoreHarness` (`slow_conformance`, plan section 5).
slow = ["botster-core-testkit/slow"]

[dependencies]
botster-core-contract.workspace = true
botster-core-edges.workspace = true
botster-core-host.workspace = true
botster-core-link.workspace = true
botster-core-sys.workspace = true
botster-route-codec.workspace = true
botster-worker-core.workspace = true
botster-terminal-ghostty.workspace = true
mio.workspace = true
serde_json.workspace = true

[dev-dependencies]
botster-conformance.workspace = true
botster-core-conformance.workspace = true
botster-core-testkit.workspace = true
botster-test-process.workspace = true
libtest-mimic.workspace = true
rustix.workspace = true
static_assertions.workspace = true
tempfile.workspace = true
toml.workspace = true

[[test]]
name = "conformance"
path = "../../tests/conformance.rs"
harness = false

[[test]]
name = "slow_conformance"
path = "../../tests/slow_conformance.rs"
harness = false
required-features = ["slow"]

# The guard fixture (tests/common/process_guard.rs) ends every member of a group: libproc lists them, kqueue awaits their
# exits, and libc names the zombie state.
[target.'cfg(target_os = "macos")'.dev-dependencies]
kqueue = "1.2.1"
libc = "0.2"
libproc = "0.14"
