# Exempt from the machine-crate lints of the root clippy.toml (plan 2.3c): this crate is the real driver of Core. It owns
# the sockets and the data directory, and wires the real edges.
# It reads no clock: the host passes every instant to `pump` (Core TM-1: "Core reads no clock of its own").
disallowed-methods = [
  { path = "std::time::Instant::now", reason = "Core reads no clock; the host passes the time to pump (Core TM-1)" },
  { path = "std::time::SystemTime::now", reason = "Core reads no clock; the host passes the time to pump (Core TM-1)" },
]
