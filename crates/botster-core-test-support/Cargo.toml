[package]
name = "botster-core-test-support"
version = "0.1.0"
edition = "2021"
authors = ["Botster contributors"]
description = "Test support and conformance fixtures for botster-core consumers"
license-file = "../../LICENSE"
readme = "../../README.md"
repository = "https://github.com/trybotster/botster-core"
homepage = "https://github.com/trybotster/botster-core"
documentation = "https://docs.rs/botster-core-test-support"
keywords = ["botster", "testing", "fixtures", "conformance"]
categories = ["development-tools::testing"]

[features]
default = ["local-runtime", "ghostty-terminal"]
local-runtime = ["botster-core/local-runtime"]
ghostty-terminal = ["dep:botster-terminal-ghostty", "botster-terminal-ghostty/libghostty-vt"]

[dependencies]
botster-core = { path = "../botster-core", version = "0.1.0", default-features = false }
botster-terminal-ghostty = { path = "../botster-terminal-ghostty", optional = true, default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[package.metadata.docs.rs]
all-features = true

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
unwrap_used = "warn"
