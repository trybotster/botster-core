[package]
name = "botster-core-test-support"
version = "0.1.0"
edition = "2021"
authors = ["Botster contributors"]
description = "Test support and conformance fixtures for botster-core consumers"
license-file = "../../LICENSE"
repository = "https://github.com/trybotster/botster-core"

[features]
default = ["local-runtime"]
local-runtime = ["botster-core/local-runtime"]

[dependencies]
botster-core = { path = "../botster-core", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
unwrap_used = "warn"
