[package]
name = "botster-core-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The real-process tests of this crate (BUILD.md testing rule 2): `cargo xtask slow` runs them.
slow = []

[dependencies]
botster-core-edges.workspace = true
data-encoding.workspace = true
getrandom.workspace = true
pty-process.workspace = true
# `net`: `sendmsg` and `recvmsg` with `SCM_RIGHTS`, the descriptor handoff of DP-2 (fd_pass.rs; plan line 452).
rustix = { workspace = true, features = ["net"] }

# Core A49: a SIGPIPE handler for the whole process; libtest-mimic runs its one test on the main thread (see the file).
[[test]]
name = "no_sigpipe"
harness = false

[dev-dependencies]
# The owned children of tests/slow_data_dir_lock.rs (BUILD.md testing rule 10), and `alone`: a test that changes state of
# its whole process runs in a new process. A dev-dependency cycle (it depends on this crate); its copy of this crate is a
# separate build, and no type crosses between the two.
botster-test-process.workspace = true
libtest-mimic.workspace = true
signal-hook.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14"
kqueue = "1.2.1"
# libc names the zombie state: `start_time` (R-78 item 3) and the guard fixture (tests/common/process_guard.rs), which ends
# every member of a group (libproc lists them, kqueue awaits their exits).
libc = "0.2"

# The slow tier's integration tests. Each file is `#![cfg(feature = "slow")]`, so without the feature its binary holds no
# test. `required-features` keeps cargo from building that empty binary in the default tier: every test binary that a
# tier builds lists the build-root test (bug catalog B13, #306).
[[test]]
name = "slow_data_dir_lock"
required-features = ["slow"]

[[test]]
name = "slow_link_order"
required-features = ["slow"]

[[test]]
name = "slow_payload"
required-features = ["slow"]

[[test]]
name = "slow_process"
required-features = ["slow"]
