[package]
name = "botster-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The real-process tests of this crate (BUILD.md testing rule 2): `cargo xtask slow` runs them.
slow = []

[dependencies]
botster-core-contract.workspace = true
botster-core-edges.workspace = true
botster-core-link.workspace = true
botster-core-sys.workspace = true
botster-worker-core.workspace = true
mio.workspace = true
rustix.workspace = true
signal-hook.workspace = true
signal-hook-mio.workspace = true

[dev-dependencies]
# The shared owner of real-process test code: the group guard of the real-PTY regression (tests/common/session.rs).
botster-test-process.workspace = true
rustix = { workspace = true, features = ["net"] }
tempfile.workspace = true

# The guard fixture (tests/common/process_guard.rs) ends every member of a group: libproc lists them, kqueue awaits their
# exits, and libc names the zombie state.
[target.'cfg(target_os = "macos")'.dev-dependencies]
kqueue = "1.2.1"
libc = "0.2"
libproc = "0.14"
