[package]
name = "botster-core-dev"
version = "0.1.0"
edition = "2021"
authors = ["Botster contributors"]
description = "Dev-only smoke harness for botster-core"
license-file = "../../LICENSE"
repository = "https://github.com/trybotster/botster-core"
homepage = "https://github.com/trybotster/botster-core"
publish = false

[dependencies]
botster-core = { path = "../botster-core" }
botster-core-test-support = { path = "../botster-core-test-support" }
serde_json = "1.0"

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
unwrap_used = "warn"
