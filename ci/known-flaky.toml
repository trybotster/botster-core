# The known-flaky tests (flake guard PR 2; xtask/src/known_flaky.rs). No mutation stage runs a listed test (each stage
# removes the listed tests that its own build has), so its flake cannot catch a mutant; the slow step and the stage-2
# baseline still run it. The slow step fails on an entry that no tier builds. Each entry needs every field; `cargo xtask
# lists` checks them. The Stage 1 exit needs this list empty.
#
# binary      the nextest binary id
# test        the exact test name
# diagnosis   the diagnosed cause
# signature   the recorded failure signature, with named fields (Core lead, 2026-10-12), which a re-gate must match
#             (BUILD.md Testing rule 9, second exception):
#             { step = "<gate step>", symptom = "<symptom>", seed = "any" | <n>, text = "<literal>" }
#             step: a step name of `cargo xtask ci --list`; symptom: step_timeout, test_timeout, assertion, signal or
#             exit_code; seed: "any" or a seed number; text (optional, not empty): a literal substring of the failing
#             test's output.
# owner       the owner of the fix
# removed_by  what removes the cause and this entry: a Core pull request "#<number>", or the pin of the contracts tag
#             that carries the fix, "contracts-v<major>.<minor>.<patch> pin"
