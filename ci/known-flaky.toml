# The known-flaky tests (flake guard PR 2; xtask/src/known_flaky.rs). No mutation stage runs a listed test, so its flake
# cannot catch a mutant; the slow step and the stage-2 baseline still run it. Each entry needs every field; `cargo xtask
# lists` checks them. The Stage 1 exit needs this list empty.
#
# binary      the nextest binary id
# test        the exact test name
# tier        the tier whose mutation stage builds the binary: "default" (stage 1) or "slow" (stage 2)
# diagnosis   the diagnosed cause
# owner       the owner of the fix
# removed_by  the pull request that removes the cause and this entry

[[flaky]]
binary = "botster-core::slow_conformance"
test = "conf::ev_5_repeated_attach_detach_without_polling_stays_bounded"
tier = "slow"
diagnosis = "R-63/R-64: the worker's pending-operation recovery is not fenced, so a repeated attach and detach without polling can leave pending_ops at the limit (PendingLimit, seed 0 step 21; plan section 8 line 509)"
owner = "P3"
removed_by = "#243"
